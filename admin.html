<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>BT Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0B0B1A;--s1:#14142B;--s2:#1D1D3A;--line:#2A2A4D;--text:#F3F0FF;--muted:#9C97C4;--violet:#7C3AED;--vl:#C4B5FD;--red:#F87171;--green:#4ADE80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,textarea,select{font:inherit;color:var(--text);background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;margin:4px 0 10px}
textarea{min-height:70px}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top b{font-size:20px}.grow{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.tabs button{flex:none;padding:9px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:14px}
.tabs button.on{background:rgba(124,58,237,.3);border-color:var(--violet);color:var(--vl)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{background:var(--violet);padding:11px 16px;border-radius:12px;font-weight:700}.btn.ghost{background:var(--s2);border:1px solid var(--line)}.btn.red{background:#7f1d1d}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.muted{color:var(--muted)}.sm{font-size:13px}.err{color:var(--red);min-height:18px;margin:4px 0}.ok{color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{font-size:24px;display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;background:var(--s2)}
.pill.pending{color:#FBBF24}.pill.approved{color:var(--green)}.pill.rejected,.pill.suspended{color:var(--red)}
img.pf{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0}
.login{max-width:380px;margin:60px auto}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);padding:11px 16px;border-radius:12px;z-index:9}
video{width:100%;max-height:240px;border-radius:12px;background:#000}
</style></head><body><div class="wrap" id="app"></div>
<script>
const SUPABASE_URL='https://ndempmyasibwvanccqjd.supabase.co',SUPABASE_KEY='sb_publishable_wD7-VXsD2nO4ToxJ5NFvjw_cWDJicVO';
const CLOUD='qpval6hr',PRESET='bt_unsigned',IDLE_MS=15*60*1000;
// admin session lives only in this tab (sessionStorage) and ends on close or after 15 idle minutes
const store={getItem:k=>{try{return sessionStorage.getItem(k)}catch{return null}},setItem:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}},removeItem:k=>{try{sessionStorage.removeItem(k)}catch{}}};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:store,persistSession:true,autoRefreshToken:true,storageKey:'bt-admin-auth'}});
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function deviceId(){try{let d=localStorage.getItem('bt_device_id');if(!d){d=(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random());localStorage.setItem('bt_device_id',d)}return d}catch{return 'admin-'+Math.random().toString(16).slice(2)+'xxxxxxxx'}}
let role=null,tab='overview',idle=null;
function touch(){clearTimeout(idle);idle=setTimeout(async()=>{await sb.auth.signOut();login('Signed out after 15 minutes of inactivity.')},IDLE_MS)}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{if(role)touch()},{passive:true}));
const rpc=async(n,a)=>{const r=await sb.rpc(n,a||{});if(r.error)throw new Error(r.error.message);return r.data};

function login(msg){
  role=null;clearTimeout(idle);
  app.innerHTML=`<div class="login card"><b style="font-size:22px">BT Admin</b><p class="muted sm">Authorised BT staff only.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err" id="er">${esc(msg||'')}</div><button class="btn" id="go" style="width:100%">Log in</button></div>`;
  $('go').onclick=async()=>{$('go').disabled=true;$('er').textContent='';
    const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
    if(error){$('go').disabled=false;$('er').textContent='Wrong email or password';return}
    boot()};
}
async function boot(){
  const {data:{user}}=await sb.auth.getUser();if(!user){login();return}
  let st;
  for(let i=0;i<40;i++){
    const r=await sb.rpc('register_session',{p_device:deviceId(),p_label:'BT Admin (web)'});
    st=r.error?'approved':r.data;
    if(st==='approved')break;
    if(st==='denied'){await sb.auth.signOut();login('This device was denied.');return}
    app.innerHTML=`<div class="login card" style="text-align:center"><div style="font-size:44px">🔐</div><b>Confirm it's you</b><p class="muted sm">Open BT on your phone and tap <b>Yes, it's me</b> to approve this browser. Waiting…</p><button class="btn ghost" id="cx">Cancel</button></div>`;
    $('cx').onclick=async()=>{i=99;await sb.auth.signOut();location.reload()};
    await new Promise(r=>setTimeout(r,4000));if(!$('cx'))return;
  }
  if(st!=='approved'){await sb.auth.signOut();login('Approval timed out. Try again.');return}
  try{role=await rpc('admin_me')}catch{role=null}
  if(!role){await sb.auth.signOut();login('This account is not a BT admin.');return}
  touch();render();
}
const TABS=[['overview','Overview'],['biz','Businesses'],['users','Users'],['banners','Banners'],['notify','Notify'],['content','Videos'],['admins','Admins'],['audit','Audit']];
function render(){
  app.innerHTML=`<div class="top"><b>BT Admin</b><span class="pill">${role==='super_admin'?'Super admin':'Admin'}</span><div class="grow"></div><button class="btn ghost sm" id="lo">Log out</button></div>
  <div class="tabs">${TABS.map(([k,n])=>`<button data-t="${k}" class="${k===tab?'on':''}">${n}</button>`).join('')}</div><div id="pane"><p class="muted">Loading…</p></div>`;
  $('lo').onclick=async()=>{await sb.auth.signOut();login()};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  (PANES[tab]||PANES.overview)().catch(e=>{$('pane').innerHTML=`<div class="card err">${esc(e.message)}</div>`});
}
const PANES={
async overview(){
  const s=await rpc('admin_stats');
  const L=[['Customers','customers'],['Business accounts','business_users'],['Pending businesses','biz_pending'],['Approved','biz_approved'],['Rejected','biz_rejected'],['Suspended biz','biz_suspended'],['New users (7d)','new_users_7d'],['Check-ins today','checkins_today'],['Check-ins total','checkins_total'],['Follows','follows_total'],['Videos live','videos_active'],['Statuses live','stories_active'],['Messages (24h)','messages_24h'],['Suspended users','suspended']];
  $('pane').innerHTML=`<div class="grid">${L.map(([n,k])=>`<div class="stat"><b>${Number(s[k]||0).toLocaleString()}</b><span class="muted sm">${n}</span></div>`).join('')}</div>
  <div class="card" style="margin-top:14px"><b>Hierarchy</b><p class="muted sm">Recalculates Top Dog and Don badges from current EXP.</p><button class="btn" id="hr">Refresh hierarchy</button></div>`;
  $('hr').onclick=async()=>{$('hr').disabled=true;try{const n=await rpc('admin_refresh_hierarchy');toast('Done. '+n+' badges assigned')}catch(e){toast(e.message)}$('hr').disabled=false};
},
async biz(){
  let status='pending',q='';
  const cats=(await sb.from('categories').select('id,name,grp').order('name')).data||[];
  const draw=async()=>{
    const rows=await rpc('admin_list_businesses',{p_status:status,p_q:q||null,p_limit:40,p_offset:0});
    $('bl').innerHTML=rows.length?rows.map(b=>`<div class="card"><div class="row"><b class="grow">${esc(b.name)}</b><span class="pill ${esc(b.verification_status)}">${esc(b.verification_status)}</span></div>
      <div class="muted sm">${esc(b.category)}${b.category_other?' · “'+esc(b.category_other)+'”':''} · ${b.followers} followers</div>
      <div class="sm" style="margin-top:6px">📍 ${esc(b.address||'')} ${b.lat!=null?`<a style="color:var(--vl)" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${b.lat},${b.lng}">map</a>`:''}</div>
      <div class="sm">📞 ${esc(b.phone||'')} · ✉ ${esc(b.owner_email||'')} · @${esc(b.owner_username||'')}</div>
      ${b.reg_number?`<div class="sm">CAC/Reg: ${esc(b.reg_number)}</div>`:''}
      ${b.about?`<p class="muted sm">${esc(b.about)}</p>`:''}
      ${b.proof_photo_url&&b.proof_photo_url.startsWith('https://res.cloudinary.com/')?`<img class="pf" src="${esc(b.proof_photo_url)}" alt="Shop front">`:''}
      ${b.rejection_reason?`<div class="sm err">Reason: ${esc(b.rejection_reason)}</div>`:''}
      <div class="row"><select data-c="${b.id}" style="width:auto;margin:0">${cats.map(c=>`<option value="${c.id}" ${c.name===b.category?'selected':''}>${esc(c.grp)} · ${esc(c.name)}</option>`).join('')}</select><button class="btn ghost sm" data-sc="${b.id}">Change type</button></div>
      <div class="row" style="margin-top:10px">
        ${b.verification_status!=='approved'?`<button class="btn sm" data-a="approve" data-i="${b.id}">Approve</button>`:''}
        ${b.verification_status!=='rejected'&&b.verification_status!=='approved'?`<button class="btn red sm" data-a="reject" data-i="${b.id}">Reject</button>`:''}
        ${b.verification_status==='approved'?`<button class="btn red sm" data-a="suspend" data-i="${b.id}">Suspend</button>`:''}
        ${b.verification_status==='suspended'?`<button class="btn sm" data-a="unsuspend" data-i="${b.id}">Unsuspend</button>`:''}</div></div>`).join(''):'<p class="muted">Nothing here.</p>';
    document.querySelectorAll('[data-a]').forEach(x=>x.onclick=async()=>{
      let reason=null;if(['reject','suspend'].includes(x.dataset.a)){reason=prompt('Reason (shown to the business):');if(!reason)return}
      try{await rpc('admin_review_business',{p_id:x.dataset.i,p_action:x.dataset.a,p_reason:reason});toast('Done');draw()}catch(e){toast(e.message)}});
    document.querySelectorAll('[data-sc]').forEach(x=>x.onclick=async()=>{const v=document.querySelector(`[data-c="${x.dataset.sc}"]`).value;
      try{await rpc('admin_set_business_category',{p_id:x.dataset.sc,p_category:Number(v)});toast('Type updated')}catch(e){toast(e.message)}});
  };
  $('pane').innerHTML=`<div class="row"><select id="st" style="width:auto"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="suspended">Suspended</option><option value="all">All</option></select><input id="q" placeholder="Search name…" style="flex:1;min-width:140px"></div>
  <div class="card"><b>Add a business type</b><div class="row"><input id="cn" placeholder="Type name" style="flex:2;min-width:140px"><input id="cg" placeholder="Group, e.g. Services" style="flex:2;min-width:140px"><button class="btn sm" id="ca">Add</button></div></div><div id="bl"></div>`;
  $('st').onchange=()=>{status=$('st').value;draw()};
  $('q').onkeydown=e=>{if(e.key==='Enter'){q=$('q').value.trim();draw()}};
  $('ca').onclick=async()=>{try{await rpc('admin_add_category',{p_name:$('cn').value,p_grp:$('cg').value||'Other'});toast('Type added');tab='biz';render()}catch(e){toast(e.message)}};
  draw();
},
async users(){
  let q='';
  const draw=async()=>{const rows=await rpc('admin_list_users',{p_q:q||null,p_limit:40,p_offset:0});
    $('ul').innerHTML=rows.map(u=>`<div class="card"><div class="row"><b class="grow">@${esc(u.username)}</b><span class="pill">${esc(u.role)}</span>${u.is_admin?'<span class="pill">admin</span>':''}${u.is_suspended?'<span class="pill suspended">suspended</span>':''}</div>
      <div class="muted sm">${esc(u.display_name||'')} · ${esc(u.email||'')} · ${Number(u.global_exp||0).toLocaleString()} EXP · joined ${new Date(u.created_at).toLocaleDateString()}</div>
      ${u.is_admin?'':`<button class="btn ${u.is_suspended?'':'red'} sm" style="margin-top:8px" data-u="${u.id}" data-s="${u.is_suspended?0:1}">${u.is_suspended?'Unsuspend':'Suspend'}</button>`}</div>`).join('')||'<p class="muted">No users.</p>';
    document.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{const s=b.dataset.s==='1';let r=null;if(s){r=prompt('Reason:');if(!r)return}
      try{await rpc('admin_suspend_user',{p_id:b.dataset.u,p_suspend:s,p_reason:r});toast('Done');draw()}catch(e){toast(e.message)}})};
  $('pane').innerHTML=`<input id="q" placeholder="Search username or name, press Enter"><div id="ul"></div>`;
  $('q').onkeydown=e=>{if(e.key==='Enter'){q=$('q').value.trim();draw()}};draw();
},
async banners(){
  const draw=async()=>{const {data,error}=await sb.from('home_slides').select('*').order('sort_order');if(error)throw new Error(error.message);
    $('bl').innerHTML=(data||[]).map(s=>`<div class="card"><div class="row"><b class="grow">${esc(s.title)}</b><span class="pill ${s.active?'approved':''}">${s.active?'live':'hidden'}</span></div>
      ${s.subtitle?`<div class="muted sm">${esc(s.subtitle)}</div>`:''}<div class="muted sm">Link: ${esc(s.link||'none')} · order ${s.sort_order}</div>
      ${s.image_url?`<img class="pf" src="${esc(s.image_url)}" alt="">`:''}
      <div class="row"><button class="btn ghost sm" data-tg="${s.id}" data-v="${s.active?0:1}">${s.active?'Hide':'Show'}</button><button class="btn red sm" data-del="${s.id}">Delete</button></div></div>`).join('')||'<p class="muted">No banners yet. The Home card shows the default message.</p>';
    document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const r=await sb.from('home_slides').update({active:b.dataset.v==='1'}).eq('id',b.dataset.tg);if(r.error)toast(r.error.message);draw()});
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete banner?'))return;const r=await sb.from('home_slides').delete().eq('id',b.dataset.del);if(r.error)toast(r.error.message);draw()});};
  $('pane').innerHTML=`<div class="card"><b>New banner for the Home “Explore” card</b>
  <input id="t" maxlength="60" placeholder="Title (required)"><input id="sbt" maxlength="140" placeholder="Short subtitle (optional)">
  <select id="lk"><option value="">No button</option><option value="nearby">Button opens: Nearby businesses</option><option value="map">Button opens: Map</option><option value="discover">Button opens: Discover videos</option><option value="chat">Button opens: Chat</option><option value="custom">Button opens: a web link…</option></select>
  <input id="lc" placeholder="https://…" style="display:none"><input id="so" type="number" placeholder="Order (0 first)" value="0">
  <label class="muted sm">Background image (optional)</label><input id="im" type="file" accept="image/*"><div class="err" id="er"></div><button class="btn" id="add">Publish banner</button></div><div id="bl"></div>`;
  $('lk').onchange=()=>{$('lc').style.display=$('lk').value==='custom'?'block':'none'};
  $('add').onclick=async()=>{const title=$('t').value.trim();if(!title){$('er').textContent='Enter a title';return}
    let link=$('lk').value;if(link==='custom'){link=$('lc').value.trim();if(!/^https:\/\//.test(link)){$('er').textContent='Link must start with https://';return}}
    $('add').disabled=true;$('er').textContent='';let image_url=null;
    try{const f=$('im').files[0];if(f){if(f.size>6e6)throw new Error('Image too big (max 6 MB)');const fd=new FormData();fd.append('file',f);fd.append('upload_preset',PRESET);
        const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:'POST',body:fd});const j=await r.json();if(!j.secure_url)throw new Error('Image upload failed');image_url=j.secure_url.replace('/upload/','/upload/c_limit,w_1200,q_auto/')}
      const r=await sb.from('home_slides').insert({title,subtitle:$('sbt').value.trim()||null,link:link||null,image_url,sort_order:Number($('so').value)||0,active:true});
      if(r.error)throw new Error(r.error.message);toast('Banner published');tab='banners';render()}catch(e){$('er').textContent=e.message;$('add').disabled=false}};
  draw();
},
async notify(){
  $('pane').innerHTML=`<div class="card"><b>Send a notification</b><p class="muted sm">Appears under the bell in BT.</p>
  <select id="au"><option value="all">Everyone</option><option value="customers">All customers</option><option value="businesses">All businesses</option><option value="user">One person…</option></select>
  <input id="un" placeholder="Their username" style="display:none"><input id="ti" maxlength="80" placeholder="Title"><textarea id="bo" maxlength="300" placeholder="Message"></textarea>
  <select id="ln"><option value="">No link</option><option value="nearby">Opens Nearby</option><option value="discover">Opens Discover</option><option value="map">Opens Map</option><option value="chat">Opens Chat</option></select>
  <div class="err" id="er"></div><button class="btn" id="sd">Send</button></div>`;
  $('au').onchange=()=>{$('un').style.display=$('au').value==='user'?'block':'none'};
  $('sd').onclick=async()=>{if(!$('ti').value.trim()){$('er').textContent='Enter a title';return}
    if(!confirm('Send this to '+$('au').options[$('au').selectedIndex].text+'?'))return;$('sd').disabled=true;
    try{const n=await rpc('admin_send_notification',{p_audience:$('au').value,p_username:$('au').value==='user'?$('un').value.trim().replace(/^@/,''):null,p_title:$('ti').value.trim(),p_body:$('bo').value.trim()||null,p_link:$('ln').value||null});
      toast('Sent to '+n+' people');$('ti').value='';$('bo').value='';$('er').textContent=''}catch(e){$('er').textContent=e.message}$('sd').disabled=false};
},
async content(){
  const rows=await rpc('admin_list_videos',{p_limit:40,p_offset:0});
  $('pane').innerHTML=rows.map(v=>`<div class="card"><div class="row"><b class="grow">${esc(v.business_name)}</b><span class="pill ${v.status==='active'?'approved':'rejected'}">${esc(v.status)}</span></div>
    ${v.video_url&&v.video_url.startsWith('https://res.cloudinary.com/')?`<video src="${esc(v.video_url)}" controls preload="none" playsinline></video>`:''}
    <div class="muted sm">${esc(v.caption||'')} · ${new Date(v.created_at).toLocaleString()}</div>
    <button class="btn ${v.status==='active'?'red':''} sm" style="margin-top:8px" data-v="${v.id}" data-s="${v.status==='active'?'removed':'active'}">${v.status==='active'?'Remove':'Restore'}</button></div>`).join('')||'<p class="muted">No videos yet.</p>';
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{try{await rpc('admin_set_video_status',{p_id:b.dataset.v,p_status:b.dataset.s});toast('Done');render()}catch(e){toast(e.message)}});
},
async admins(){
  const rows=await rpc('admin_list_admins'),sup=role==='super_admin';
  $('pane').innerHTML=`${sup?`<div class="card"><b>Add an admin</b><p class="muted sm">The person must already have a BT account. Only super admins can do this.</p><input id="au" placeholder="Their BT username"><button class="btn" id="aa">Make admin</button></div>`
    :`<div class="card muted sm">Only the super admin can add or remove admins.</div>`}
  ${rows.map(a=>`<div class="card"><div class="row"><b class="grow">@${esc(a.username)}</b><span class="pill">${esc(a.role)}</span></div><div class="muted sm">${esc(a.display_name||'')}</div>
   ${sup&&a.role!=='super_admin'?`<button class="btn red sm" style="margin-top:8px" data-r="${esc(a.username)}">Remove admin</button>`:''}</div>`).join('')}`;
  if(sup){$('aa').onclick=async()=>{try{await rpc('admin_set_admin',{p_username:$('au').value.trim().replace(/^@/,''),p_make:true});toast('Admin added');render()}catch(e){toast(e.message)}};
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove @'+b.dataset.r+' as admin?'))return;try{await rpc('admin_set_admin',{p_username:b.dataset.r,p_make:false});toast('Removed');render()}catch(e){toast(e.message)}})}
},
async audit(){
  const rows=await rpc('admin_audit',{p_limit:80});
  $('pane').innerHTML=rows.map(r=>`<div class="card sm"><b>${esc(r.action)}</b> <span class="muted">by @${esc(r.admin_username||'?')} · ${new Date(r.created_at).toLocaleString()}</span><div class="muted">${esc(r.target||'')}</div></div>`).join('')||'<p class="muted">Nothing logged yet.</p>';
}};
boot();
</script></body></html>
