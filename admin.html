<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>BT Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#120826;--s1:#1d0d40;--s2:#2a1552;--s3:#361c68;--line:#3d2275;--text:#F7F2FF;--muted:#B7A6E0;--violet:#7A1FFF;--vl:#C9A8FF;--red:#F87171;--green:#4ADE80;--amber:#FFB547;--shadow:0 8px 24px rgba(0,0,0,.28)}
:root[data-theme=light]{--bg:#F5F3FF;--s1:#fff;--s2:#F1EEFF;--s3:#E7E2FF;--line:#E2DDF5;--text:#1B1535;--muted:#6B6590;--vl:#6D28D9;--shadow:0 6px 20px rgba(76,29,149,.08)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .1s,background .15s,opacity .15s}button:active{transform:scale(.97)}
input,textarea,select{font:inherit;color:var(--text);background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;margin:4px 0 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.2)}
textarea{min-height:80px;resize:vertical}label{font-size:13px;font-weight:700;color:var(--muted)}
a{color:var(--vl)}
/* layout */
.shell{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:var(--s1);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800;font-size:18px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#7A1FFF,#C9A8FF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(124,58,237,.4)}
.brand small{display:block;font-weight:600;font-size:11px;color:var(--muted);margin-top:-2px}
.ng{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-weight:700;color:var(--muted)}
.nav:hover{background:var(--s2);color:var(--text)}.nav.on{background:rgba(124,58,237,.18);color:var(--vl)}
.nav .ic{width:22px;text-align:center;font-size:17px}.nav .n{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:1px 7px}
.main{flex:1;min-width:0}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar h1{font-size:21px;margin:0;font-weight:800}.bar .grow{flex:1}
.menu{display:none;font-size:22px;padding:4px 8px}
.gsearch{max-width:300px;margin:0}
.content{padding:22px;max-width:1100px}
.who{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7A1FFF,#C9A8FF);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
/* components */
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:16px;font-weight:800}
.btn{background:var(--violet);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.btn.ghost{background:var(--s2);color:var(--text);box-shadow:none;border:1px solid var(--line)}.btn.red{background:#B91C1C;box-shadow:none}.btn.green{background:#15803D;box-shadow:none}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}.sm{font-size:13px}.err{color:var(--red);min-height:20px;margin:2px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .ico{font-size:20px}.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1;margin-top:6px}.stat span{color:var(--muted);font-size:13px}
.att{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.attc{text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:block;width:100%}
.attc.hot{border-color:var(--amber);background:linear-gradient(135deg,rgba(255,181,71,.12),var(--s1))}
.attc b{font-size:30px;font-weight:800;display:block;line-height:1}.attc span{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:800;background:var(--s2);color:var(--muted)}
.pill.pending{color:var(--amber)}.pill.approved,.pill.active,.pill.resolved{color:var(--green)}.pill.rejected,.pill.suspended,.pill.removed,.pill.open{color:var(--red)}.pill.dismissed{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:7px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:13px}.chip.on{background:rgba(124,58,237,.22);border-color:var(--violet);color:var(--vl)}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--s1);margin-bottom:10px}
img.pf{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin:8px 0;cursor:zoom-in}
video{width:100%;max-height:260px;border-radius:12px;background:#000}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;margin:8px 0}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.empty{text-align:center;padding:46px 14px;color:var(--muted)}.empty i{font-style:normal;font-size:44px;display:block;margin-bottom:8px}.empty b{color:var(--text);display:block;font-size:17px}
.sk{background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200% 100%;animation:shim 1.2s infinite linear;border-radius:14px;height:92px;margin-bottom:12px}@keyframes shim{to{background-position:-200% 0}}
/* modal + toast */
.modalbg{position:fixed;inset:0;background:rgba(5,5,15,.6);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .18s ease-out}
.modal.wide{max-width:560px}.modal h2{margin:0 0 6px;font-size:19px}@keyframes pop{from{transform:scale(.96);opacity:0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--s3);color:var(--text);border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:200;box-shadow:var(--shadow);font-weight:700}
.toast.bad{border-color:var(--red)}
/* chart */
.chart text{fill:var(--muted);font-size:10px}.legend{display:flex;gap:14px;font-size:13px;margin:6px 0 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
/* login */
.login{max-width:400px;margin:9vh auto;padding:0 16px}.login .card{padding:26px}
.login .logo{width:54px;height:54px;font-size:22px;border-radius:16px;margin:0 auto 14px}
.banner-prev{border-radius:18px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,rgba(76,29,149,.9),rgba(124,58,237,.65));background-size:cover;background-position:center;color:#fff}
.banner-prev h2{margin:6px 0 2px;font-size:21px}.banner-prev p{margin:0 0 10px;font-size:13px;opacity:.9}
.banner-prev .go{align-self:flex-start;background:var(--violet);padding:7px 14px;border-radius:10px;font-weight:800;font-size:13px}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}.side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .menu{display:block}.content{padding:16px}.bar{padding:12px 14px}.gsearch{display:none}.kv{grid-template-columns:90px 1fr}
}

/* ---------- modal helpers (replace prompt/confirm) ---------- */
function modal(html,{wide}={}){const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  const close=()=>{bg.remove();document.removeEventListener('keydown',esc_)};const esc_=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc_);
  bg.onclick=e=>{if(e.target===bg)close()};document.body.appendChild(bg);return {el:bg.firstChild,close}}
function confirmBox(title,text,okLabel,danger){return new Promise(res=>{const m=modal(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="mc">Cancel</button><button class="btn ${danger?'red':''}" id="mo">${esc(okLabel||'Confirm')}</button></div>`);
  m.el.querySelector('#mc').onclick=()=>{m.close();res(false)};m.el.querySelector('#mo').onclick=()=>{m.close();res(true)}})}
function askText(title,text,{presets=[],label='Reason',min=3,ok='Send',danger}={}){return new Promise(res=>{

  m.el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{m.el.querySelector('#tx').value=b.dataset.p});
  m.el.querySelector('#mc').onclick=()=>{m.close();res(null)};
  m.el.querySelector('#mo').onclick=()=>{const v=m.el.querySelector('#tx').value.trim();if(v.length<min){m.el.querySelector('#er').textContent='Please write a little more';return}m.close();res(v)}})}

/* ---------- login + device approval ---------- */
function login(msg){role=null;clearTimeout(idle);
  app.innerHTML=`<div class="login"><div class="card"><div class="logo">BT</div><h2 style="text-align:center;margin:0 0 4px">BT Admin</h2><p class="muted sm" style="text-align:center;margin:0 0 16px">Authorised BT staff only.</p>
  <label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="er">${esc(msg||'')}</div><button class="btn" id="go" style="width:100%">Log in</button></div></div>`;
  const go=async()=>{$('go').disabled=true;$('er').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
    if(error){$('go').disabled=false;$('er').textContent='Wrong email or password';return}boot()};
  $('go').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()}}
async function boot(){
  const {data:{user}}=await sb.auth.getUser();if(!user){login();return}me=user;let st;
  for(let i=0;i<40;i++){const r=await sb.rpc('register_session',{p_device:deviceId(),p_label:'BT Admin (web)'});st=r.error?'approved':r.data;
    if(st==='approved')break;
    if(st==='denied'){await sb.auth.signOut();login('This device was denied.');return}
    app.innerHTML=`<div class="login"><div class="card" style="text-align:center"><div class="logo">🔐</div><h2>Confirm it's you</h2><p class="muted sm">Open BT on your phone and tap <b>Yes, it's me</b> to approve this browser. Waiting…</p><button class="btn ghost" id="cx">Cancel</button></div></div>`;
    let stop=false;$('cx').onclick=async()=>{stop=true;await sb.auth.signOut();location.reload()};
    await new Promise(r=>setTimeout(r,4000));if(stop||!$('cx'))return}
  if(st!=='approved'){await sb.auth.signOut();login('Approval timed out. Try again.');return}
  try{role=await rpc('admin_me')}catch{role=null}
  if(!role){await sb.auth.signOut();login('This account is not a BT admin.');return}
  try{const {data}=await sb.from('profiles').select('username,display_name,avatar_url').eq('id',user.id).single();me={...user,...data}}catch{}
  touch();shell();refreshCounts();route();
}

async function openTicket(t,after){
  const th=await rpc('ticket_thread',{p_ticket:t.id});
  const p=t.payload;const gm=p&&p.lat!=null?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`:'';
  const m=modal(`<h2>${esc(t.subject)}</h2><p class="muted sm">${esc(t.business_name||t.display_name||t.username)} · @${esc(t.username)} · ${esc(t.role)} · ${esc(t.category)}</p>
  <div style="max-height:40vh;overflow:auto">${th.map(x=>`<div style="margin:8px 0;padding:10px 12px;border-radius:12px;background:${x.from_admin?'var(--s2)':'rgba(124,58,237,.18)'}"><b class="sm">${x.from_admin?'BT team':'@'+esc(t.username)}</b> <span class="muted sm">${ago(x.created_at)}</span><div style="white-space:pre-wrap;margin-top:4px">${esc(x.body)}</div></div>`).join('')}</div>
  ${p&&p.lat!=null?`<div class="card sm" style="margin:10px 0"><b>Requested new location</b><div class="muted">${esc(p.address||'')}</div><a class="link" target="_blank" rel="noopener" href="${gm}">Check it on Google Maps</a></div>`:''}
  <label>Reply</label><textarea id="rt" maxlength="1000"></textarea><div class="err" id="er"></div>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mc">Close window</button>${t.category==='location'&&p&&t.status==='open'?'<button class="btn green" id="ap">Apply this location</button>':''}<button class="btn ghost" id="rc">Reply and close</button><button class="btn" id="rp">Reply</button></div>`,{wide:true});
  const q=s=>m.el.querySelector(s),send=async close=>{const b=q('#rt').value.trim();if(!b&&!close){q('#er').textContent='Write a reply';return}
    try{await rpc('admin_reply_ticket',{p_ticket:t.id,p_body:b,p_close:!!close});toast('Sent');m.close();after();refreshCounts()}catch(e){q('#er').textContent=e.message}};
  q('#mc').onclick=()=>m.close();q('#rp').onclick=()=>send(false);q('#rc').onclick=()=>send(true);
  if(q('#ap'))q('#ap').onclick=async()=>{if(!await confirmBox('Move this business?','Its pin and address change now. Its 3-month cycle is not used up.','Apply'))return;
    try{await rpc('admin_apply_location_ticket',{p_ticket:t.id});toast('Location applied');m.close();after();refreshCounts()}catch(e){q('#er').textContent=e.message}};
}

/* ---------- charts ---------- */
function lineChart(labels,series){const W=640,H=200,P={l:30,r:8,t:10,b:22},max=Math.max(4,...series.flatMap(s=>s.data)),X=i=>P.l+i*(W-P.l-P.r)/Math.max(1,labels.length-1),Y=v=>H-P.b-(v/max)*(H-P.t-P.b);
  const grid=[0,.5,1].map(f=>{const v=Math.round(max*f),y=Y(v);return `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P.l-6}" y="${y+3}" text-anchor="end">${v}</text>`}).join('');
  const xl=labels.map((l,i)=>i%Math.ceil(labels.length/7)===0?`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`:'').join('');
  const lines=series.map(s=>{const d=s.data.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    return `<path d="${d} L${X(s.data.length-1)},${Y(0)} L${X(0)},${Y(0)} Z" fill="${s.color}" opacity=".12"/><path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${s.data.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${s.color}"><title>${esc(labels[i])}: ${v} ${esc(s.name)}</title></circle>`).join('')}`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Trend chart">${grid}${xl}${lines}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`}

  <div class="row"><div class="grow"><label>Order</label><input id="so" type="number" value="0"></div></div><div class="err" id="er"></div><button class="btn" id="add">Publish</button></div>

  <h3 style="margin:18px 0 10px">Live on Home</h3><div id="bl"></div>`;
  const prev=()=>{$('bpt').textContent=$('t').value||'Your title';$('bps').textContent=$('sbt').value;$('bpg').style.display=kind?'inline-block':'none';$('bpg').textContent=kind==='location'?'📍 Get directions':'👥 Visit community'};
  ['t','sbt'].forEach(i=>$(i).oninput=prev);
  $('im').onchange=()=>{const f=$('im').files[0];if(!f)return;const u=URL.createObjectURL(f);$('fp').innerHTML=f.type.startsWith('video/')?`<video src="${u}" controls muted playsinline style="max-height:180px;max-width:100%"></video>`:`<img class="pf" style="max-height:180px" src="${u}" alt="">`;if(!f.type.startsWith('video/'))$('bp').style.backgroundImage=`linear-gradient(180deg,rgba(11,11,26,.15),rgba(11,11,26,.85)),url('${u}')`};
  document.querySelectorAll('#fk [data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;document.querySelectorAll('#fk .chip').forEach(x=>x.classList.toggle('on',x===b));$('bx').style.display=kind?'block':'none';
    $('fh').textContent=kind==='location'?'Tapping opens Google Maps directions to the business.':kind==='group'?'Tapping opens the business page, where people can follow and join its community.':'';prev()});
  let tm=null;$('bq').oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{try{const r=await rpc('admin_business_options',{p_q:$('bq').value.trim()||null});
    $('bo').innerHTML=r.map(b=>`<button class="item" data-b="${b.id}" style="width:100%;text-align:left"><div class="grow"><b>${esc(b.name)}</b><div class="muted sm">${esc(b.address||'')}${b.has_location?'':' · no location saved'}</div></div></button>`).join('');
    document.querySelectorAll('#bo [data-b]').forEach(x=>x.onclick=()=>{biz=r.find(y=>y.id===x.dataset.b);$('bs').innerHTML='Selected: <b>'+esc(biz.name)+'</b>';$('bo').innerHTML=''})}catch(e){toast(e.message,1)}},300)};
  $('bl').innerHTML=(data||[]).length?data.map(s=>`<div class="item"><div class="grow"><b>${esc(s.title)}</b> <span class="pill ${s.active?'approved':''}">${s.active?'live':'hidden'}</span>${s.tag_kind?`<span class="pill">${s.tag_kind==='location'?'📍 location':'👥 group'}</span>`:''}${s.subtitle?`<div class="muted sm">${esc(s.subtitle)}</div>`:''}<div class="muted sm">Order ${s.sort_order}${s.link?' · opens '+esc(s.link):''}</div>${safeImg(s.image_url)?(s.media_type==='video'?`<video src="${esc(s.image_url)}" controls preload="none" playsinline style="margin-top:6px;max-height:140px"></video>`:`<img class="pf" style="max-height:140px" src="${esc(s.image_url)}" alt="">`):''}</div>
    <div class="row"><button class="btn ghost sm" data-tg="${s.id}" data-v="${s.active?0:1}">${s.active?'Hide':'Show'}</button><button class="btn red sm" data-del="${s.id}">Delete</button></div></div>`).join(''):'<div class="empty"><i>🖼️</i><b>No posts yet</b>Home shows the default Explore card.</div>';
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const r=await sb.from('home_slides').update({active:b.dataset.v==='1'}).eq('id',b.dataset.tg);if(r.error)toast(r.error.message,1);route()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!await confirmBox('Delete this post?','This cannot be undone.','Delete',1))return;const r=await sb.from('home_slides').delete().eq('id',b.dataset.del);if(r.error)toast(r.error.message,1);route()});
  $('add').onclick=async()=>{const title=$('t').value.trim();if(!title){$('er').textContent='Enter a title';return}
    if(kind&&!biz){$('er').textContent='Choose the business to tag';return}
    if(kind==='location'&&!biz.has_location){$('er').textContent='This business has no saved location';return}
    const f=$('im').files[0];const isV=!!f&&f.type.startsWith('video/');
    if(f){if(!isV&&!f.type.startsWith('image/')){$('er').textContent='Picture or video only';return}
      if(f.size>(isV?25e6:8e6)){$('er').textContent=isV?'Video too big (max 25 MB)':'Picture too big (max 8 MB)';return}
      if(isV){const dur=await new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>r(v.duration);v.onerror=()=>r(0);v.src=URL.createObjectURL(f)});
        if(!dur||dur>15.5){$('er').textContent=dur?'Video is '+Math.round(dur)+' seconds. Maximum is 15 seconds.':'Could not read this video';return}}}
    $('add').disabled=true;$('er').textContent=f?'Uploading…':'';
    try{let url=null;if(f){const fd=new FormData();fd.append('file',f);fd.append('upload_preset',PRESET);
        const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/${isV?'video':'image'}/upload`,{method:'POST',body:fd});const j=await r.json();if(!j.secure_url)throw new Error('Upload failed');url=isV?j.secure_url:j.secure_url.replace('/upload/','/upload/c_limit,w_1200,q_auto/')}
      const r=await sb.from('home_slides').insert({title,subtitle:$('sbt').value.trim()||null,image_url:url,media_type:isV?'video':'image',tag_kind:kind||null,business_id:kind?biz.id:null,sort_order:Number($('so').value)||0,active:true});
      if(r.error)throw new Error(r.error.message);toast('Published');route()}catch(e){$('er').textContent=e.message;$('add').disabled=false}};
},
async notify(){
  $('pane').innerHTML=`<div class="row" style="align-items:flex-start"><div class="card grow" style="min-width:300px"><h3>Send a notification</h3><p class="muted sm" style="margin:0 0 10px">Appears under the bell in BT.</p>
  <label>Who should get it?</label><select id="au"><option value="all">Everyone</option><option value="customers">All customers</option><option value="businesses">All businesses</option><option value="user">One person…</option></select><input id="un" placeholder="Their username" style="display:none">
  <label>Title</label><input id="ti" maxlength="80"><label>Message</label><textarea id="bo" maxlength="300"></textarea>
  <label>Opens (optional)</label><select id="ln"><option value="">Nothing</option><option value="nearby">Nearby</option><option value="discover">Discover</option><option value="map">Map</option><option value="chat">Chat</option></select><div class="err" id="er"></div><button class="btn" id="sd">Send</button></div>
  <div class="grow" style="min-width:280px"><label>Preview</label><div class="item" style="margin-top:4px"><div style="font-size:24px">🔴</div><div class="grow"><b id="pt">Your title</b><div class="muted sm" id="pb"></div><div class="muted sm" style="margin-top:4px">just now</div></div></div></div></div>`;
  const prev=()=>{$('pt').textContent=$('ti').value||'Your title';$('pb').textContent=$('bo').value};['ti','bo'].forEach(i=>$(i).oninput=prev);
  $('au').onchange=()=>{$('un').style.display=$('au').value==='user'?'block':'none'};
  $('sd').onclick=async()=>{if(!$('ti').value.trim()){$('er').textContent='Enter a title';return}
    if(!await confirmBox('Send now?','This goes to '+$('au').options[$('au').selectedIndex].text.toLowerCase()+'. It cannot be taken back.','Send'))return;$('sd').disabled=true;
    try{const n=await rpc('admin_send_notification',{p_audience:$('au').value,p_username:$('au').value==='user'?$('un').value.trim().replace(/^@/,''):null,p_title:$('ti').value.trim(),p_body:$('bo').value.trim()||null,p_link:$('ln').value||null});
      toast('Sent to '+num(n)+' people');$('ti').value='';$('bo').value='';$('er').textContent='';prev()}catch(e){$('er').textContent=e.message}$('sd').disabled=false};
},
async admins(){
  const rows=await rpc('admin_list_admins'),sup=role==='super_admin';
  $('pane').innerHTML=`${sup?`<div class="card"><h3>Add an admin</h3><p class="muted sm" style="margin:0 0 10px">The person must already have a BT account. Only the super admin can add or remove admins.</p><div class="row"><input id="au" placeholder="Their BT username" style="flex:1;min-width:200px;margin:0"><button class="btn" id="aa">Make admin</button></div></div>`:`<div class="card muted">Only the super admin can add or remove admins.</div>`}
  ${rows.map(a=>`<div class="item" style="align-items:center"><div class="av">${esc((a.display_name||a.username||'?')[0].toUpperCase())}</div><div class="grow"><b>${esc(a.display_name||a.username)}</b> <span class="muted">@${esc(a.username)}</span></div><span class="pill ${a.role==='super_admin'?'approved':''}">${esc(a.role.replace('_',' '))}</span>${sup&&a.role!=='super_admin'?`<button class="btn red sm" data-r="${esc(a.username)}">Remove</button>`:''}</div>`).join('')}`;
  if(sup){$('aa').onclick=async()=>{try{await rpc('admin_set_admin',{p_username:$('au').value.trim().replace(/^@/,''),p_make:true});toast('Admin added');route()}catch(e){toast(e.message,1)}};
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(!await confirmBox('Remove @'+b.dataset.r+'?','They will lose all admin access.','Remove',1))return;try{await rpc('admin_set_admin',{p_username:b.dataset.r,p_make:false});toast('Removed');route()}catch(e){toast(e.message,1)}})}
},
async audit(){
  const rows=await rpc('admin_audit',{p_limit:150});let f='';
  const draw=()=>{const v=rows.filter(r=>!f||(r.action+' '+(r.target||'')+' '+(r.admin_username||'')).toLowerCase().includes(f));
    $('al').innerHTML=v.length?v.map(r=>`<div class="item" style="align-items:center"><div class="grow"><b>${esc(r.action.replace(/_/g,' '))}</b><div class="muted sm" style="word-break:break-word">${esc(r.target||'')}</div></div><div class="muted sm" style="text-align:right">@${esc(r.admin_username||'?')}<br>${new Date(r.created_at).toLocaleString()}</div></div>`).join(''):'<div class="empty"><i>📜</i><b>Nothing logged</b></div>'};
  $('pane').innerHTML=`<input id="f" placeholder="Filter: action, name or admin" style="max-width:360px"><div id="al"></div>`;$('f').oninput=()=>{f=$('f').value.trim().toLowerCase();draw()};draw();
}};

/* ---------- business cards, shared by review + businesses ---------- */
function bizCard(b){const st=b.verification_status,photo=safeImg(b.proof_photo_url);
  return `<div class="card" data-b="${b.id}"><div class="row"><b class="grow" style="font-size:17px">${esc(b.name)}</b><span class="pill ${esc(st)}">${esc(st)}</span></div>
  <div class="muted sm">${esc(b.category)}${b.category_other?' · “'+esc(b.category_other)+'”':''} · ${num(b.followers)} followers${b.submitted_at?' · submitted '+ago(b.submitted_at):''}</div>
  <dl class="kv"><dt>Address</dt><dd>${esc(b.address||'')} ${b.lat!=null?`<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${b.lat},${b.lng}">Open map</a>`:''}</dd>
  <dt>Phone</dt><dd>${b.phone?`<a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>`:'-'}</dd><dt>Owner</dt><dd>@${esc(b.owner_username||'')} · ${esc(b.owner_email||'')}</dd>${b.reg_number?`<dt>CAC / Reg.</dt><dd>${esc(b.reg_number)}</dd>`:''}${b.about?`<dt>About</dt><dd>${esc(b.about)}</dd>`:''}</dl>
  ${photo?`<img class="pf" src="${esc(photo)}" alt="Shop front" data-zoom="${esc(photo)}">`:'<div class="muted sm">No shop photo</div>'}
  ${b.rejection_reason?`<div class="sm err">Last reason: ${esc(b.rejection_reason)}</div>`:''}
  <div class="row" style="margin-top:10px">${st!=='approved'?`<button class="btn green sm" data-a="approve">Approve</button>`:''}${st==='pending'||st==='rejected'?`<button class="btn ghost sm" data-a="reject">${st==='pending'?'Ask for changes':'Update reason'}</button>`:''}${st==='approved'?`<button class="btn red sm" data-a="suspend">Suspend</button>`:''}${st==='suspended'?`<button class="btn green sm" data-a="unsuspend">Unsuspend</button>`:''}
  <button class="btn ghost sm" data-a="type">Change type</button><button class="btn ghost sm" data-a="qr">New QR code</button></div></div>`}
function wireBiz(root,after){
  root.querySelectorAll('[data-zoom]').forEach(i=>i.onclick=()=>modal(`<img src="${esc(i.dataset.zoom)}" style="width:100%;border-radius:12px" alt="">`,{wide:1}));
  root.querySelectorAll('.card[data-b] [data-a]').forEach(b=>b.onclick=async()=>{const id=b.closest('[data-b]').dataset.b,a=b.dataset.a;
    try{
      if(a==='approve'){if(!await confirmBox('Approve this business?','It will appear in search, Nearby and the map, and the owner is notified.','Approve'))return;await rpc('admin_review_business',{p_id:id,p_action:'approve',p_reason:null})}
      else if(a==='reject'){const r=await askText('Ask for changes','The owner sees this and can fix and resubmit.',{presets:['Shop photo is unclear','Address is incomplete','We could not reach your phone number','Business type does not match the photo'],ok:'Send to owner'});if(!r)return;await rpc('admin_review_business',{p_id:id,p_action:'reject',p_reason:r})}
      else if(a==='suspend'){const r=await askText('Suspend this business?','It disappears from BT until you unsuspend it.',{ok:'Suspend',danger:1});if(!r)return;await rpc('admin_review_business',{p_id:id,p_action:'suspend',p_reason:r})}
      else if(a==='unsuspend'){await rpc('admin_review_business',{p_id:id,p_action:'unsuspend',p_reason:null})}
      else if(a==='qr'){if(!await confirmBox('Make a new QR code?','The old printed QR stops working. The owner can show the new one in BT.','Make new code',1))return;await rpc('admin_regenerate_qr',{p_business:id});toast('New QR code created');return}
      else if(a==='type'){const cats=window.__cats||(await sb.from('categories').select('id,name,grp').order('name')).data||[];
        const m=modal(`<h2>Change business type</h2><select id="ct">${cats.map(c=>`<option value="${c.id}">${esc(c.grp||'')} · ${esc(c.name)}</option>`).join('')}</select><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mc">Cancel</button><button class="btn" id="mo">Save</button></div>`);
        m.el.querySelector('#mc').onclick=m.close;m.el.querySelector('#mo').onclick=async()=>{try{await rpc('admin_set_business_category',{p_id:id,p_category:Number(m.el.querySelector('#ct').value)});m.close();toast('Type updated');after()}catch(e){toast(e.message,1)}};return}
      toast('Done');after();refreshCounts();
    }catch(e){toast(e.message,1)}})}

/* ---------- person drawer ---------- */
async function userDrawer(id,after){
  const m=modal('<div class="sk"></div>',{wide:1});
  try{const u=await rpc('admin_user_detail',{p_id:id});
    m.el.innerHTML=`<div class="row"><div class="av" style="width:48px;height:48px;font-size:20px">${esc((u.display_name||u.username)[0].toUpperCase())}</div><div class="grow"><h2 style="margin:0">${esc(u.display_name||u.username)}</h2><div class="muted">@${esc(u.username)} · ${esc(u.role)}</div></div>${u.is_suspended?'<span class="pill suspended">suspended</span>':''}${u.is_admin?'<span class="pill approved">admin</span>':''}</div>
    <dl class="kv"><dt>Email</dt><dd>${esc(u.email||'')}</dd><dt>Joined</dt><dd>${new Date(u.created_at).toLocaleDateString()}</dd>${u.role==='customer'?`<dt>EXP</dt><dd><b>${num(u.global_exp)}</b></dd><dt>Check-ins</dt><dd>${num(u.checkins)}</dd>`:''}<dt>Followers</dt><dd>${num(u.followers)} · following ${num(u.following)}</dd><dt>Reports on them</dt><dd>${num(u.reports_against)}</dd>${u.business?`<dt>Business</dt><dd>${esc(u.business.name)} <span class="pill ${esc(u.business.status)}">${esc(u.business.status)}</span></dd>`:''}${u.bio?`<dt>Bio</dt><dd>${esc(u.bio)}</dd>`:''}</dl>
    ${(u.recent_checkins||[]).length?`<b class="sm">Recent check-ins</b>${u.recent_checkins.map(c=>`<div class="row sm" style="padding:6px 0;border-top:1px solid var(--line)"><span class="grow">${esc(c.name)}</span><span class="muted">${c.exp?'+'+c.exp+' EXP':'0 EXP'} · ${ago(c.created_at)}</span></div>`).join('')}`:''}
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="x">Close</button>${u.role==='customer'?'<button class="btn ghost" id="ex">Adjust EXP</button>':''}${u.role==='customer'&&!u.is_admin?'<button class="btn ghost" id="cv">Convert to business</button>':''}${u.is_admin?'':`<button class="btn ${u.is_suspended?'green':'red'}" id="sp">${u.is_suspended?'Unsuspend':'Suspend'}</button>`}</div>`;
    m.el.querySelector('#x').onclick=m.close;
    const ex=m.el.querySelector('#ex');if(ex)ex.onclick=async()=>{m.close();const m2=modal(`<h2>Adjust EXP</h2><p class="muted sm">For fixing genuine problems, such as a QR glitch. Every change is logged with your name and reason.</p><label>Change (use a minus to remove)</label><input id="d" type="number" placeholder="e.g. 100 or -100"><label>Reason</label><textarea id="r" maxlength="200"></textarea><div class="err" id="er"></div><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mc">Cancel</button><button class="btn" id="mo">Apply</button></div>`);
      m2.el.querySelector('#mc').onclick=m2.close;m2.el.querySelector('#mo').onclick=async()=>{try{const n=await rpc('admin_adjust_exp',{p_user:id,p_delta:parseInt(m2.el.querySelector('#d').value,10)||0,p_reason:m2.el.querySelector('#r').value.trim()});m2.close();toast('EXP is now '+num(n));after()}catch(e){m2.el.querySelector('#er').textContent=e.message}}};
    const cv=m.el.querySelector('#cv');if(cv)cv.onclick=async()=>{m.close();if(!await confirmBox('Convert @'+u.username+' to a business account?','Their customer follows, statuses and Top Dog or Don badges are removed. Next time they open BT they will go through business setup, and you will review it before it goes live. This cannot be undone.','Convert',1))return;
      try{await rpc('admin_convert_to_business',{p_user:id});toast('Converted. They will set up their business next time they open BT');after()}catch(e){toast(e.message,1)}};
    const sp=m.el.querySelector('#sp');if(sp)sp.onclick=async()=>{let r=null;if(!u.is_suspended){r=await askText('Suspend @'+u.username+'?','They are locked out until you unsuspend them.',{label:'Reason (internal)',ok:'Suspend',danger:1});if(!r)return}
      try{await rpc('admin_suspend_user',{p_id:id,p_suspend:!u.is_suspended,p_reason:r});m.close();toast('Done');after()}catch(e){toast(e.message,1)}};
  }catch(e){m.el.innerHTML=`<h2>Could not load</h2><p class="err">${esc(e.message)}</p><button class="btn ghost" id="x">Close</button>`;m.el.querySelector('#x').onclick=m.close}
}
boot();
