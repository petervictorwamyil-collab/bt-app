<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B1A">
<title>BT - Business Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#0B0B1A;--surface:#16162B;--violet:#7C3AED;--vl:#A78BFA;--text:#F3F0FF;--muted:#9A98B8;--red:#ff6b6b}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 90px}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center}
  .logo{border-radius:20px;width:150px;height:150px}
  .logo.sm{width:44px;height:44px;border-radius:10px}
  .muted{color:var(--muted)}
  input,select{width:100%;background:var(--surface);color:var(--text);border:0;border-radius:14px;padding:15px 14px;font-size:16px;margin:0 0 12px;outline:none}
  input::placeholder{color:var(--muted)}
  label.chk{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px;color:var(--text);font-size:15px}
  label.chk input{width:20px;height:20px;margin:0;flex:none}
  button{font:inherit;cursor:pointer}
  .btn{width:100%;background:var(--violet);color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700}
  .btn:disabled{opacity:.6}
  .link{background:none;border:0;color:var(--vl);padding:12px;font-size:15px}
  .err{color:var(--red);margin:6px 0 12px;font-size:14px;min-height:1px}
  .ok{color:var(--vl);margin:6px 0 12px;font-size:14px}
  .card{background:var(--surface);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .ava{width:52px;height:52px;border-radius:12px;background:rgba(124,58,237,.3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:22px}
  .ava img{width:100%;height:100%;object-fit:cover}
  .grow{flex:1;min-width:0}
  .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .banner{background:linear-gradient(135deg,#5B21B6,#7C3AED);border-radius:18px;padding:18px;margin:16px 0 20px}
  .banner b{font-size:17px}
  h2{font-size:18px;margin:6px 0 10px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .mapbtn{flex:none;width:52px;height:52px;border-radius:14px;background:var(--violet);border:0;color:#fff;font-size:22px}
  .bar{height:10px;border-radius:8px;background:var(--bg);overflow:hidden;margin:10px 0 8px}
  .bar i{display:block;height:100%;background:var(--violet)}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:1000}
  nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0;font-size:11px}
  nav button.on{color:var(--vl)}
  nav button span{display:block;font-size:20px}
  .tile{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;width:100%;border:0;color:var(--text);font-size:16px;text-align:left}
  #map{height:calc(100vh - 160px);border-radius:16px;margin-top:10px}
  .hidden{display:none!important}
  .pin{display:flex;flex-direction:column;align-items:center;width:110px;margin-left:-55px}
  .pin .c{width:42px;height:42px;border-radius:50%;border:3px solid #7C3AED;background:#16162B;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .pin .c img{width:100%;height:100%;object-fit:cover}
  .pin .t{background:rgba(11,11,26,.9);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;margin-top:2px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg{display:flex;gap:8px;margin-bottom:14px}
  .seg button{flex:1;padding:12px;border-radius:12px;border:2px solid var(--surface);background:var(--surface);color:var(--text)}
  .seg button.on{border-color:var(--violet)}
</style>
</head>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $app = document.getElementById('app');

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg = u => (typeof u === 'string' && u.startsWith('https://res.cloudinary.com/')) ? u : null;
const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

const LADDER = [
  {n:'Novice',from:0,next:2500},{n:'Intermediate',from:2500,next:8750},
  {n:'Pro',from:8750,next:17500},{n:'Pro Nova',from:17500,next:25000},{n:'Nova',from:25000,next:null}];
const statusFor = e => [...LADDER].reverse().find(s => e >= s.from) || LADDER[0];

function atLeast16(d){ const n=new Date(); const c=new Date(n.getFullYear()-16,n.getMonth(),n.getDate()); return d<=c; }

// ---------- screens ----------
function splash(){
  $app.innerHTML = `<div class="center"><img class="logo" src="${LOGO}" alt="BT">
  <p class="muted" style="letter-spacing:1.2px">Discover • Grow • Succeed</p></div>`;
}

function loginView(msg=''){
  $app.innerHTML = `<div class="wrap" style="padding-top:40px">
  <div style="text-align:center;margin-bottom:26px"><img class="logo" src="${LOGO}" alt="BT" style="width:110px;height:110px">
  <div class="muted">Discover • Grow • Succeed</div></div>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <label class="chk"><input id="rm" type="checkbox" checked> Remember me</label>
  <div class="err" id="er">${esc(msg)}</div>
  <button class="btn" id="go">Log in</button>
  <div style="text-align:center"><button class="link" id="reg">New to BT? Create an account</button></div></div>`;
  let fails=0, lock=0;
  $('reg').onclick = registerView;
  $('go').onclick = async () => {
    if (Date.now() < lock) { $('er').textContent='Too many attempts. Wait a minute.'; return; }
    const email=$('em').value.trim(), pw=$('pw').value;
    if(!email||!pw){ $('er').textContent='Enter your email and password'; return; }
    $('go').disabled=true; $('er').textContent='';
    const {error} = await sb.auth.signInWithPassword({email,password:pw});
    $('go').disabled=false;
    if(error){
      if(++fails>=5){ lock=Date.now()+60000; fails=0; }
      $('er').textContent = /confirm/i.test(error.message) ? 'Verify your email first (check for the code).' : 'Wrong email or password';
      return;
    }
    lsSet('bt_remember', $('rm').checked ? '1' : '0');
    appView();
  };
}

function registerView(){
  let role='customer';
  $app.innerHTML = `<div class="wrap">
  <button class="link" id="back" style="padding-left:0">&larr; Back</button>
  <h2 style="font-size:24px">Create account</h2>
  <div class="seg"><button id="rc" class="on">I am a customer</button><button id="rb">I own a business</button></div>
  <input id="nm" placeholder="Full name">
  <input id="un" placeholder="Unique username (letters, numbers, _)" autocapitalize="none" autocomplete="off">
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password (8+, letters and numbers)">
  <div class="muted" style="font-size:13px;margin:0 0 4px 4px">Date of birth (must be 16+)</div>
  <input id="dob" type="date">
  <label class="chk"><input id="ag" type="checkbox"> I agree to the Terms of Use and Privacy Policy</label>
  <div class="err" id="er"></div>
  <button class="btn" id="go">Create account</button></div>`;
  $('back').onclick = () => loginView();
  $('rc').onclick = () => { role='customer'; $('rc').className='on'; $('rb').className=''; };
  $('rb').onclick = () => { role='business'; $('rb').className='on'; $('rc').className=''; };
  $('go').onclick = async () => {
    const name=$('nm').value.trim(), un=$('un').value.trim().toLowerCase(), email=$('em').value.trim(), pw=$('pw').value, dobS=$('dob').value;
    let e='';
    if(name.length<2) e='Enter your name';
    else if(!/^[a-z0-9_]{3,20}$/.test(un)) e='Username: 3-20 characters, letters, numbers and underscore only';
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) e='Enter a valid email';
    else if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)) e='Password must be 8+ characters with letters and numbers';
    else if(!dobS) e='Pick your date of birth';
    else if(!atLeast16(new Date(dobS))) e='You must be at least 16 to join BT';
    else if(!$('ag').checked) e='Please accept the Terms and Privacy Policy';
    if(e){ $('er').textContent=e; return; }
    $('go').disabled=true; $('er').textContent='';
    const {data,error} = await sb.auth.signUp({email,password:pw,options:{data:{username:un,display_name:name,date_of_birth:dobS,role}}});
    $('go').disabled=false;
    if(error){
      const m=error.message.toLowerCase();
      $('er').textContent = m.includes('database error')||m.includes('username') ? 'That username is taken or invalid. Try another.'
        : m.includes('already') ? 'This email is already registered. Try logging in.' : error.message;
      return;
    }
    if(data.session){ lsSet('bt_remember','1'); appView(); } else verifyView(email);
  };
}

function verifyView(email){
  $app.innerHTML = `<div class="wrap">
  <h2 style="font-size:24px">Verify your email</h2>
  <p>We sent a code to <b>${esc(email)}</b>. Check your inbox and spam folder.</p>
  <input id="cd" inputmode="numeric" maxlength="8" placeholder="Code" style="text-align:center;font-size:24px;letter-spacing:8px">
  <div class="err" id="er"></div><div class="ok" id="ok"></div>
  <button class="btn" id="go">Verify</button>
  <div style="text-align:center"><button class="link" id="rs">Resend code</button></div></div>`;
  $('go').onclick = async () => {
    const token=$('cd').value.trim();
    if(token.length<6){ $('er').textContent='Enter the code from your email'; return; }
    $('go').disabled=true; $('er').textContent='';
    const {error} = await sb.auth.verifyOtp({email,token,type:'signup'});
    $('go').disabled=false;
    if(error){ $('er').textContent='Wrong or expired code. Request a new one.'; return; }
    lsSet('bt_remember','1'); appView();
  };
  $('rs').onclick = async () => {
    const {error} = await sb.auth.resend({type:'signup',email});
    $('er').textContent = error ? 'Could not resend yet. Wait a minute and try again.' : '';
    $('ok').textContent = error ? '' : 'New code sent. Check your inbox and spam.';
  };
}

// ---------- main app ----------
let profile=null, businesses=[], tab='home', query='', mapObj=null, showMap=false;

async function appView(){
  splash();
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ loginView(); return; }
  const [p, b] = await Promise.all([
    sb.from('profiles').select('display_name,username,role,global_exp').eq('id',user.id).single(),
    sb.rpc('list_businesses',{p_limit:50})
  ]);
  profile = p.data;
  businesses = b.data || [];
  const warn = [];
  if(p.error) warn.push('Profile: '+p.error.message);
  if(b.error) warn.push('Businesses: '+b.error.message+' (run bt_step3.sql in Supabase)');
  tab='home'; showMap=false; render(warn.join(' | '));
}

function render(warn=''){
  const tabs=[['home','🏠','Home'],['discover','▶️','Discover'],['add','➕','Add'],['chat','💬','Chat'],['account','👤','Account']];
  $app.innerHTML = `<div class="wrap" id="body"></div>
  <nav>${tabs.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; showMap=false; render();});
  const body=$('body');
  if(tab==='home') homeTab(body,warn);
  else if(tab==='account') accountTab(body);
  else {
    const notes={discover:'Business videos arrive in a later step',add:'Posting arrives with Discover and Where You\'ve Been',chat:'Chats and communities arrive in a later step'};
    body.innerHTML=`<div class="center" style="min-height:70vh"><h2>${esc(tab[0].toUpperCase()+tab.slice(1))}</h2><p class="muted">${esc(notes[tab])}</p></div>`;
  }
}

function bizAvatar(b){ const u=safeImg(b.logo_url); return u?`<img src="${esc(u)}" alt="">`:'🏪'; }

function homeTab(body,warn){
  if(showMap){ mapView(body); return; }
  const exp=(profile&&profile.global_exp)||0, st=statusFor(exp);
  const pct = st.next ? Math.min(100,Math.max(0,(exp-st.from)/(st.next-st.from)*100)) : 100;
  body.innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <img class="logo sm" src="${LOGO}" alt="BT"><span class="muted">${profile?'Hi, '+esc(profile.display_name):''}</span></div>
  ${warn?`<div class="err">${esc(warn)}</div>`:''}
  <div class="row"><input id="q" placeholder="🔍  Search businesses around you" value="${esc(query)}" style="margin:0"><button class="mapbtn" id="mp">🗺️</button></div>
  <div class="banner"><b>Explore businesses around you</b><div style="color:#E9DDFF;margin-top:4px">Discover • Grow • Succeed</div></div>
  <h2>Trending near you</h2><div id="list"></div>
  <div class="card" style="display:block;margin-top:18px;padding:18px">
    <div style="display:flex;justify-content:space-between"><b>Your EXP</b><b style="color:var(--vl)">${esc(st.n)}</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="muted">${st.next?`${exp} / ${st.next} EXP to next status`:`${exp} EXP • Top status reached`}</div></div>`;
  const drawList=()=>{
    const q=query.trim().toLowerCase();
    const items=businesses.filter(b=>!q||b.name.toLowerCase().includes(q)||(b.category||'').toLowerCase().includes(q));
    $('list').innerHTML = items.length ? items.map(b=>`<div class="card"><div class="ava">${bizAvatar(b)}</div>
      <div class="grow"><div class="name">${esc(b.name)}</div><div class="muted">${esc(b.category)}</div></div>
      <div style="text-align:center"><b>${Number(b.follower_count)||0}</b><div class="muted" style="font-size:11px">followers</div></div></div>`).join('')
      : '<p class="muted">No verified businesses yet. The founding cohort is coming soon.</p>';
  };
  drawList();
  $('q').oninput = e => { query=e.target.value; drawList(); };
  $('mp').onclick = () => { showMap=true; render(); };
}

function mapView(body){
  body.innerHTML = `<button class="link" id="bk" style="padding-left:0">&larr; Back</button><b>BT Map</b><div id="map"></div>`;
  $('bk').onclick = () => { showMap=false; render(); };
  const pins = businesses.filter(b=>b.lat!=null&&b.lng!=null);
  const center = pins.length ? [pins[0].lat,pins[0].lng] : [11.1511,7.6486];
  if(mapObj){ mapObj.remove(); mapObj=null; }
  mapObj = L.map('map').setView(center,15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(mapObj);
  pins.forEach(b=>{
    const u=safeImg(b.logo_url);
    const html=`<div class="pin"><div class="c">${u?`<img src="${esc(u)}" alt="">`:'🏪'}</div><div class="t">${esc(b.name)}</div></div>`;
    L.marker([b.lat,b.lng],{icon:L.divIcon({html,className:'',iconSize:[0,0],iconAnchor:[0,0]})}).addTo(mapObj);
  });
}

function accountTab(body){
  body.innerHTML = `<div style="text-align:center;margin:10px 0 22px">
    <div class="ava" style="width:84px;height:84px;border-radius:50%;margin:0 auto 10px;font-size:40px">👤</div>
    <div style="font-size:22px;font-weight:800">${esc(profile&&profile.display_name)}</div>
    <div class="muted">${profile?'@'+esc(profile.username)+' • '+esc(profile.role):''}</div></div>
  <button class="tile" id="cu"><span>Change username</span><span>›</span></button>
  <button class="tile" onclick="alert('Arrives with Cloudinary uploads')"><span>Change profile picture</span><span>›</span></button>
  <button class="tile" onclick="alert('Coming soon')"><span>Privacy Policy</span><span>›</span></button>
  <button class="tile" onclick="alert('Coming soon')"><span>Terms of Use</span><span>›</span></button>
  <button class="tile" id="lo" style="color:var(--red)"><span>Log out</span><span>›</span></button>`;
  $('cu').onclick = async () => {
    const n=(prompt('New username (3-20: letters, numbers, _). You can change it once every 4 months.')||'').trim().toLowerCase();
    if(!n) return;
    if(!/^[a-z0-9_]{3,20}$/.test(n)){ alert('Use 3-20 letters, numbers or underscore'); return; }
    const {error}=await sb.rpc('change_username',{p_new:n});
    if(error){ alert(/4 months/.test(error.message)?'You can only change your username once every 4 months':'That username is taken or invalid'); return; }
    profile.username=n; alert('Username updated'); render();
  };
  $('lo').onclick = async () => { await sb.auth.signOut(); lsSet('bt_remember','0'); loginView(); };
}

// ---------- boot ----------
(async () => {
  splash();
  await new Promise(r=>setTimeout(r,1500));
  const {data:{session}} = await sb.auth.getSession();
  if(session && lsGet('bt_remember')==='1') appView();
  else { if(session) await sb.auth.signOut(); loginView(); }
})();
</script>
</body>
