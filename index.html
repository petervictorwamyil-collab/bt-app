<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B1A">
<title>BT - Business Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0B0B1A;--s1:#14142A;--s2:#1B1B38;--line:rgba(167,139,250,.18);--violet:#7C3AED;--vl:#A78BFA;--text:#F3F0FF;--muted:#9A98B8;--red:#ff6b6b;--green:#4ade80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,rgba(124,58,237,.28),transparent 60%),radial-gradient(700px 400px at -10% 30%,rgba(76,29,149,.25),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.screen{max-width:480px;margin:0 auto;padding:16px 16px 110px;min-height:100vh}
.screen.plain{padding-bottom:30px}
.muted{color:var(--muted)} .vl{color:var(--vl)} .sm{font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.top b{font-size:18px;flex:1}
.ib{width:40px;height:40px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;flex:none}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--violet);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
input,select,textarea{width:100%;background:var(--s1);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:15px 14px;font:inherit;font-size:16px;margin:0 0 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 4px}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px;font-size:15px}
label.chk input{width:20px;height:20px;margin:0;flex:none}
.btn{width:100%;background:linear-gradient(135deg,#7C3AED,#9F67FF);color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:700;text-align:center}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--s1);border:1px solid var(--line)}
.btn.sm2{width:auto;padding:10px 16px;font-size:14px;border-radius:12px}
.btn.visit{width:100%;padding:10px;font-size:14px;border-radius:12px;margin-top:8px}
.link{color:var(--vl);padding:12px;font-size:15px}
.err{color:var(--red);font-size:14px;margin:2px 0 12px;min-height:1px}
.ok{color:var(--green);font-size:14px;margin:2px 0 12px}
.card{background:linear-gradient(160deg,rgba(124,58,237,.14),rgba(20,20,42,.9));border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{padding:0;overflow:hidden;position:relative;min-height:160px;display:flex;flex-direction:column;justify-content:flex-end}
.hero .hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,rgba(76,29,149,.85),rgba(124,58,237,.6)),url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200"><rect fill="%231a1035" width="400" height="200"/></svg>');background-size:cover;background-position:center}
.hero .hero-body{position:relative;padding:18px 16px 16px;z-index:1}
.pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(167,139,250,.2);color:var(--vl);margin-bottom:8px;font-weight:600}
.hero h2{margin:0 0 6px;font-size:22px;line-height:1.25;font-weight:800}
.hero h2 span{color:var(--vl)}
.hero p{margin:0 0 12px;color:rgba(243,240,255,.85);font-size:13px;line-height:1.4}
.q4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.q4 button{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;font-size:11px;text-align:center;line-height:1.25;font-weight:600}
.q4 button i{display:block;font-style:normal;font-size:24px;margin-bottom:8px;width:42px;height:42px;line-height:42px;border-radius:14px;margin-left:auto;margin-right:auto}
.q4 button i.p{background:rgba(124,58,237,.25)}
.q4 button i.g{background:rgba(74,222,128,.2)}
.q4 button i.b{background:rgba(96,165,250,.2)}
.q4 button i.y{background:rgba(250,204,21,.2)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.sec b{font-size:17px} .sec button{color:var(--vl);font-size:13px;font-weight:600}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.bc{flex:none;width:160px;background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left}
.bc .img{height:100px;background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(20,20,42,1));display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;position:relative}
.bc .img img{width:100%;height:100%;object-fit:cover}
.bc .badge-st{position:absolute;bottom:6px;left:6px;font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(11,11,26,.85);color:var(--vl);font-weight:700;border:1px solid var(--line)}
.bc .t{padding:10px 10px 12px}
.nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:12px;align-items:center}
.ava{width:48px;height:48px;border-radius:14px;background:rgba(124,58,237,.3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:20px}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.round{border-radius:50%;background:linear-gradient(135deg,#7C3AED,#C4B5FD);font-weight:800;color:#fff}
.grow{flex:1;min-width:0}
.bar{height:8px;border-radius:8px;background:var(--bg);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7C3AED,#A78BFA);border-radius:8px}
.srch{display:flex;gap:10px;margin-bottom:14px}
.srch input{margin:0;border-radius:16px;padding:13px 14px}
.mapb{flex:none;width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,#7C3AED,#A78BFA);font-size:20px;display:flex;align-items:center;justify-content:center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(15,15,32,.97);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
nav .in{max-width:480px;margin:0 auto;display:flex;align-items:center;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;color:var(--muted);font-size:10px;padding:6px 0;font-weight:600}
nav button span{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--vl)}
nav button.plus{flex:none;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#A78BFA);color:#fff;font-size:28px;margin:-24px 6px 0;box-shadow:0 8px 24px rgba(124,58,237,.55)}
.evcard{display:flex;gap:12px;align-items:center}
.evdate{flex:none;width:48px;text-align:center;background:rgba(124,58,237,.2);border-radius:12px;padding:8px 4px}
.evdate b{display:block;font-size:18px;line-height:1.1}
.evdate span{font-size:11px;color:var(--vl);font-weight:700}
.header-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.header-row .brand{flex:1}
.header-row .brand b{font-size:20px;display:block}
.header-row .brand .tag{font-size:11px;color:var(--muted);letter-spacing:.3px}
.menu{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
.menu button{width:100%;display:flex;align-items:center;gap:14px;padding:15px 16px;text-align:left;font-size:16px;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu button i{font-style:normal;width:24px;text-align:center;font-size:18px}
.menu button em{margin-left:auto;font-style:normal;color:var(--muted)}
.menu button.danger{color:var(--red)}
.mh{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:20px}
.logo{border-radius:20px;width:130px;height:130px}
.logo.s{width:40px;height:40px;border-radius:10px}
.seg{display:flex;gap:0;margin:0 -16px 14px;border-bottom:1px solid var(--line);padding:0 16px}
.seg button{flex:1;padding:14px 8px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--text);border-bottom-color:var(--violet)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:600}
.chips button.on{background:rgba(124,58,237,.25);border-color:var(--violet);color:var(--vl)}
.vid{position:relative;border-radius:16px;overflow:hidden;background:var(--s2);aspect-ratio:9/14;margin-bottom:12px}
.vid .thumb{width:100%;height:100%;background:linear-gradient(160deg,rgba(124,58,237,.4),rgba(20,20,42,.95));display:flex;align-items:center;justify-content:center;font-size:48px}
.vid .meta{position:absolute;left:0;right:0;bottom:0;padding:14px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.vid .meta .nm{font-size:14px}
.vid-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats-row{display:flex;justify-content:center;gap:28px;margin:14px 0 6px}
.stats-row div{text-align:center}
.stats-row b{display:block;font-size:18px}
.stats-row span{font-size:12px;color:var(--muted)}
.profile-head{text-align:center;padding:8px 0 4px}
.profile-head .ava{margin:0 auto 12px;border:3px solid var(--violet)}
.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--s2)} .steps i.on{background:var(--violet)}
#map{height:calc(100vh - 150px);border-radius:18px;border:1px solid var(--line)}
.pin{display:flex;flex-direction:column;align-items:center;width:110px;margin-left:-55px}
.pin .c{width:42px;height:42px;border-radius:50%;border:3px solid #7C3AED;background:#16162B;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pin .c img{width:100%;height:100%;object-fit:cover}
.pin .t{background:rgba(11,11,26,.9);font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;margin-top:2px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legal h3{font-size:16px;margin:20px 0 6px;color:var(--vl)}
.legal p{margin:0 0 8px;line-height:1.55;color:#d9d5ee;font-size:15px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:90%}
.lad{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty i{display:block;font-style:normal;font-size:44px;margin-bottom:10px}
</style>
</head>

const SUPPORT_EMAIL='Businesstracka01@gmail.com';
const SESSION_DAYS=90; // 90 days when "Remember me" is on. Change to 395 for Instagram-style length.

/* ---------- Cloudinary (fill these in to enable photo / video upload) ----------
   1. Create a free account at https://cloudinary.com
   2. Dashboard → copy Cloud name
   3. Settings → Upload → Add upload preset → Signing mode: Unsigned
      (name it e.g. bt_unsigned). Restrict to image/video if you want.
   4. Paste values below. Leave empty to keep upload disabled. */
const CLOUDINARY_CLOUD = 'qpval6hr';
const CLOUDINARY_PRESET = 'bt_unsigned';
window.CLOUDINARY_CLOUD = CLOUDINARY_CLOUD; // so editProfile can check

/* ---------- storage + session policy ----------
   Remember me OFF  -> session lives only in this browser tab/session (gone when you close it)
   Remember me ON   -> kept up to SESSION_DAYS days, then login is required again            */
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let remember=lsGet('bt_remember')==='1';
const authStorage={
  getItem:k=>{try{return sessionStorage.getItem(k)??localStorage.getItem(k)}catch{return null}},
  setItem:(k,v)=>{try{const a=remember?localStorage:sessionStorage,b=remember?sessionStorage:localStorage;a.setItem(k,v);b.removeItem(k)}catch{}},
  removeItem:k=>{try{sessionStorage.removeItem(k);localStorage.removeItem(k)}catch{}}
};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:authStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let recovering=false;
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;recoveryView()}});

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id), $app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=u=>(typeof u==='string'&&u.startsWith('https://res.cloudinary.com/'))?u:null;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/** Upload a File to Cloudinary (unsigned preset). resourceType: 'image' | 'video' | 'auto' */
async function uploadToCloudinary(file, resourceType='image'){
  if(!CLOUDINARY_CLOUD || !CLOUDINARY_PRESET){
    toast('Cloudinary not configured yet');
    return null;
  }
  const fd=new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLOUDINARY_PRESET);
  const endpoint=`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/${resourceType}/upload`;
  const res=await fetch(endpoint,{method:'POST',body:fd});
  if(!res.ok) throw new Error('Cloudinary upload failed');
  const data=await res.json();
  return data.secure_url || data.url || null;
}

/* ---------- location ---------- */
function getPos(){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>{geo={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};res(geo)},()=>res(null),{enableHighAccuracy:true,timeout:15000,maximumAge:20000});
})}
const km=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km';
const hav=(a,b,c,d)=>{const R=6371000,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function nearbyFor(pos,radius=10000){
  const {data,error}=await sb.rpc('nearby_businesses',{p_lat:pos.lat,p_lng:pos.lng,p_radius:radius,p_limit:60});
  if(!error&&data)return data;
  // fallback until bt_step4.sql is installed: filter the list on the phone
  return businesses.filter(b=>b.lat!=null&&b.lng!=null).map(b=>({...b,distance_m:hav(pos.lat,pos.lng,b.lat,b.lng)})).filter(b=>b.distance_m<=radius).sort((x,y)=>x.distance_m-y.distance_m);
}
async function nearbyIfAllowed(){
  try{
    if(!navigator.permissions)return;
    const st=await navigator.permissions.query({name:'geolocation'});
    if(st.state!=='granted')return;
    const pos=await getPos();if(!pos)return;
    const near=await nearbyFor(pos);
    if(near.length){businesses=near;if(cur.name==='home')draw()}
  }catch{}
}

  const [p,b,mb]=await Promise.all([
    sb.from('profiles').select('display_name,username,role,global_exp,bio,username_changed_at').eq('id',user.id).single(),
    sb.rpc('list_businesses',{p_limit:50}),
    sb.from('businesses').select('id,name,about,address,verified,follower_count').eq('owner_id',user.id).maybeSingle()
  ]);
  profile=p.data;businesses=b.data||[];myBiz=mb.data||null;
  profile=profile||{display_name:'',username:'',role:'customer',global_exp:0};
  if(profile.role==='business'&&!myBiz){bizWizard(1);return}
  query='';show('home');

  startWatchers();nearbyIfAllowed();
}

  // Matches design: Home | Discover | + | Community | Account
  return `<nav><div class="in">${t('home','🏠','Home')}${t('discover','🔍','Discover')}<button class="plus" data-t="plus" aria-label="Add">+</button>${t('chat','👥','Community')}${t('account','👤','Account')}</div></nav>`;
}
const soon=(title,icon,text)=>({html:`${topbar(title)}<div class="empty"><i>${icon}</i><b style="color:var(--text)">${esc(title)}</b><p>${esc(text)}</p></div>`});

/** Parse a scanned QR and try check-in / open profile */
async function handleScannedQR(raw){
  const box=$('scanResult');
  const show=(html)=>{ if(box){ box.style.display='block'; box.innerHTML=html; } };
  let data=null;
  try{ data=JSON.parse(raw); }catch{}
  // BT business QR
  if(data && data.t==='bt_biz' && data.id){
    show(`<b>Business found</b><div class="nm" style="margin-top:6px">${esc(data.name||'Business')}</div>
      <p class="muted sm">Checking you in…</p>`);
    try{
      const {error}=await sb.rpc('check_in',{p_business_id:data.id});
      if(error) throw error;
      toast('+100 EXP · Check-in recorded');
      show(`<b class="ok">Checked in ✓</b><div class="nm" style="margin-top:6px">${esc(data.name||'')}</div>
        <p class="muted sm">You earned EXP for this visit.</p>
        <button class="btn sm2" style="margin-top:10px" id="qrHome">Back home</button>`);
      const h=$('qrHome'); if(h) h.onclick=()=>show('home');
    }catch(e){
      // Fallback if RPC does not exist yet in Supabase
      show(`<b>Business QR</b><div class="nm" style="margin-top:6px">${esc(data.name||data.id)}</div>
        <p class="muted sm">QR read successfully. Add a <b>check_in</b> function in Supabase later to award EXP automatically.</p>
        <button class="btn sm2" style="margin-top:10px" id="qrHome2">OK</button>`);
      const h=$('qrHome2'); if(h) h.onclick=()=>show('home');
      toast('QR scanned · check-in backend not set up yet');
    }
    return;
  }
  // BT user QR
  if(data && data.t==='bt_user' && (data.u||data.id)){
    show(`<b>User</b><div class="nm" style="margin-top:6px">@${esc(data.u||data.id)}</div>
      <p class="muted sm">Profile links open in a future update.</p>
      <button class="btn sm2" style="margin-top:10px" id="qrHomeU">OK</button>`);
    const hu=$('qrHomeU'); if(hu) hu.onclick=()=>window.__btShow&&window.__btShow('home');
    return;
  }
  // Plain text / unknown
  show(`<b>Scanned</b><p class="muted sm" style="word-break:break-all;margin-top:8px">${esc(String(raw).slice(0,200))}</p>
    <p class="muted sm">Not a BT business QR. Business codes look like {"t":"bt_biz",...}</p>
    <button class="btn sm2" style="margin-top:10px" id="qrAgain">Scan again</button>`);
  const ag=$('qrAgain'); if(ag) ag.onclick=()=>window.__btShow&&window.__btShow('scanner');
}

  /* ----- QR SCANNER (camera) ----- */
  scanner(){
    let html5Qr=null;
    return {html:`
    ${topbar('QR Scanner')}
    <p class="muted sm" style="margin-top:-6px;margin-bottom:12px">Point your camera at a business QR code to check in and earn EXP.</p>
    <div id="qrReader" style="width:100%;max-width:400px;margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;min-height:280px"></div>
    <div class="err" id="er" style="text-align:center;margin-top:12px"></div>
    <div id="scanResult" style="display:none" class="card"></div>
    <button class="btn ghost" id="stopScan" style="margin-top:12px">Close camera</button>
    <p class="muted sm" style="text-align:center;margin-top:10px">Allow camera access when your browser asks.</p>`,
    async bind(){
      const onSuccess=async(decoded)=>{
        try{ if(html5Qr) await html5Qr.stop(); }catch{}
        html5Qr=null;
        $('qrReader').style.display='none';
        $('stopScan').style.display='none';
        await handleScannedQR(decoded);
      };
      const start=async()=>{
        if(typeof Html5Qrcode==='undefined'){
          $('er').textContent='Scanner library failed to load. Check your connection and refresh.';
          return;
        }
        try{
          html5Qr=new Html5Qrcode('qrReader');
          await html5Qr.start(
            {facingMode:'environment'},
            {fps:10, qrbox:{width:240,height:240}},
            onSuccess,
            ()=>{}
          );
        }catch(e){
          $('er').textContent='Could not open camera. Allow camera permission and try again on HTTPS/mobile.';
        }
      };
      $('stopScan').onclick=async()=>{
        try{ if(html5Qr) await html5Qr.stop(); }catch{}
        html5Qr=null; back();
      };
      start();
      // cleanup when leaving view is handled by stop button / success
    }};
  },

  /* ----- MY QR CODE (generate) ----- */
  qrCode(){
    const payload = profile.role==='business' && myBiz
      ? JSON.stringify({t:'bt_biz', id: myBiz.id, name: myBiz.name})
      : JSON.stringify({t:'bt_user', id: me.id, u: profile.username});
    const label = profile.role==='business' && myBiz
      ? `Business check-in · ${myBiz.name}`
      : `@${profile.username}`;
    return {html:`
    ${topbar('My QR code')}
    <div class="card" style="text-align:center">
      <p class="muted sm">Others can scan this code to find you${profile.role==='business'?' or check in at your business':''}.</p>
      <div id="qrBox" style="display:inline-block;padding:16px;background:#fff;border-radius:16px;margin:12px 0"></div>
      <div class="nm" style="margin-top:4px">${esc(label)}</div>
      <div class="muted sm" style="margin-top:6px;word-break:break-all;font-size:11px">${esc(payload)}</div>
    </div>
    <button class="btn ghost" id="shareQr">Copy code text</button>`,
    bind(){
      const box=$('qrBox');
      box.innerHTML='';
      if(typeof QRCode!=='undefined'){
        new QRCode(box,{text:payload,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
      } else {
        box.innerHTML='<p class="muted">QR library failed to load. Refresh the page.</p>';
      }
      $('shareQr').onclick=async()=>{
        try{ await navigator.clipboard.writeText(payload); toast('Copied'); }
        catch{ toast(payload); }
      };
    }};
  },

  /* ----- UNIFIED SEARCH (people + businesses) ----- */
  search(p={}){
    const mode=p.mode||'all';
    return {html:`${topbar(mode==='chat'?'Find to chat':'Search')}
    <input id="q" placeholder="🔍  People, usernames, businesses…" value="${esc(query)}" autofocus>
    <div id="list"><p class="muted sm">Type to search…</p></div>`,
    bind(){
      const draw2=async()=>{
        const q=($('q').value||'').trim().toLowerCase();
        if(!q){$('list').innerHTML='<p class="muted sm">Type a name or username…</p>';return;}
        // Businesses (already loaded)
        const bizHits=businesses.filter(b=>b.name.toLowerCase().includes(q)||(b.category||'').toLowerCase().includes(q));
        // People – query Supabase profiles
        let people=[];
        try{
          const {data}=await sb.from('profiles').select('id,display_name,username,role,global_exp').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(20);
          people=(data||[]).filter(u=>u.id!==me.id);
        }catch(e){}
        let html='';
        if(people.length){
          html+=`<div class="mh">People</div>`+people.map(u=>`<div class="card row"><div class="ava round">${esc(initial(u.display_name))}</div><div class="grow"><div class="nm">${esc(u.display_name)}</div><div class="muted sm">@${esc(u.username)} • ${esc(u.role)}</div></div></div>`).join('');
        }
        if(bizHits.length){
          html+=`<div class="mh">Businesses</div>`+bizHits.map(b=>`<div class="card row"><div class="ava">${bizAva(b)}</div><div class="grow"><div class="nm">${esc(b.name)}</div><div class="muted sm">${esc(b.category)}</div></div><div style="text-align:center"><b>${Number(b.follower_count)||0}</b><div class="muted" style="font-size:11px">followers</div></div></div>`).join('');
        }
        $('list').innerHTML=html||'<div class="empty"><i>🔎</i>No people or businesses found.</div>';
      };
      $('q').oninput=()=>{clearTimeout(window._st);window._st=setTimeout(draw2,280)};
      draw2();
    }};
  },

  /* ----- ADD STATUS (customers only) ----- */
  addStatus(){
    if(profile.role==='business'){show('addDiscover');return {html:''};}
    return {html:`${topbar('Your Status')}
    <div class="card"><p class="muted">Statuses are like WhatsApp / Instagram Stories. Only people who follow you <b>and</b> you follow back can see them. They disappear after 24 hours.</p>
    <label class="f">Video or photo</label>
    <input type="file" id="sf" accept="video/*,image/*">
    <label class="f" style="margin-top:12px">Caption (optional)</label>
    <textarea id="sc" maxlength="150" placeholder="What's happening?"></textarea>
    <div class="err" id="er"></div>
    <button class="btn" id="sp">Post to Status</button>
    <p class="muted sm">${CLOUDINARY_CLOUD?'Ready to upload via Cloudinary.':'Fill CLOUDINARY_CLOUD + CLOUDINARY_PRESET at the top of this file to enable uploads.'}</p></div>`,
    bind(){
      $('sp').onclick=async()=>{
        const f=$('sf').files[0];
        if(!f){$('er').textContent='Choose a video or photo first';return;}
        if(!CLOUDINARY_CLOUD){toast('Connect Cloudinary first (see top of index.html)');return;}
        $('sp').disabled=true;$('er').textContent='';
        try{
          const isVid=f.type.startsWith('video');
          const url=await uploadToCloudinary(f, isVid?'video':'image');
          if(!url){ $('sp').disabled=false; return; }
          // Optional: save to a `statuses` table when you create one in Supabase
          // await sb.from('statuses').insert({ user_id: me.id, media_url: url, caption: $('sc').value.trim(), expires_at: new Date(Date.now()+24*3600e3).toISOString() });
          toast('Status uploaded ✓ (save-to-DB step is optional next)');
          back();
        }catch(e){$('er').textContent='Upload failed. Check Cloudinary settings.';}
        $('sp').disabled=false;
      };
    }};
  },

  exp(){
    if(profile.role==='business'){
      return {html:`${topbar('EXP')}<div class="card"><p class="muted">EXP and status ladder are only for customer accounts. Businesses grow through followers, visits and Discover posts.</p></div>`};

    return {html:`${topbar('My EXP')}<div class="card"><div class="muted sm">Your status</div><div style="font-size:30px;font-weight:800">${esc(st.n)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="muted sm">${exp.toLocaleString()} EXP${st.next?` • ${(st.next-exp).toLocaleString()} to next status`:''}</div></div>
    <div class="mh">Status ladder</div><div class="menu" style="padding:4px 12px">${LADDER.map(l=>`<div class="lad"><span>${exp>=l.from?'✓ ':''}${esc(l.n)}</span><span class="muted">${l.from.toLocaleString()}+ EXP</span></div>`).join('')}</div>
    <p class="muted sm">Each verified visit earns 100 EXP. Scan limits apply per business type.</p>`};
  },
  map(){
    return {html:`${topbar('BT Map')}<div id="mmsg"></div><div id="map" style="position:relative"></div>`,async bind(){
      const msg=$('mmsg'),box=$('map');
      box.innerHTML='<div class="empty"><i>📡</i>Finding your location…</div>';
      const pos=await getPos();
      if(cur.name!=='map')return;
      if(!pos){
        box.style.display='none';
        msg.innerHTML=`<div class="empty"><i>📍</i><b style="color:var(--text)">Turn on location</b><p>BT Map shows the area around where you are right now. Allow location for this site in your browser, then try again.</p><button class="btn" id="rt">Try again</button></div>`;
        $('rt').onclick=()=>show('map',{},false);return}
      if(typeof L==='undefined'){box.innerHTML='<div class="empty">Map could not load. Check your connection.</div>';return}
      box.innerHTML='';
      if(mapObj){mapObj.remove();mapObj=null}
      mapObj=L.map('map').setView([pos.lat,pos.lng],16);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(mapObj);
      const me_=L.circleMarker([pos.lat,pos.lng],{radius:9,color:'#fff',weight:3,fillColor:'#7C3AED',fillOpacity:1}).addTo(mapObj);
      const acc=L.circle([pos.lat,pos.lng],{radius:Math.min(pos.acc||50,300),color:'#7C3AED',weight:1,fillOpacity:.12}).addTo(mapObj);
      const here=document.createElement('button');
      here.textContent='◎';here.setAttribute('aria-label','My location');
      here.style.cssText='position:absolute;right:12px;bottom:12px;z-index:999;width:46px;height:46px;border-radius:50%;background:#7C3AED;color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.5)';
      here.onclick=()=>{if(geo)mapObj.setView([geo.lat,geo.lng],16)};box.appendChild(here);
      if(mapWatch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(mapWatch);
      if(navigator.geolocation)mapWatch=navigator.geolocation.watchPosition(p=>{geo={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};me_.setLatLng([geo.lat,geo.lng]);acc.setLatLng([geo.lat,geo.lng]).setRadius(Math.min(geo.acc||50,300))},()=>{},{enableHighAccuracy:true,maximumAge:10000});
      [100,400,1000].forEach(t=>setTimeout(()=>mapObj&&mapObj.invalidateSize(),t));
      const near=await nearbyFor(pos,10000);
      if(cur.name!=='map'||!mapObj)return;
      near.forEach(b=>{const u=safeImg(b.logo_url);
        L.marker([b.lat,b.lng],{icon:L.divIcon({html:`<div class="pin"><div class="c">${u?`<img src="${esc(u)}" alt="">`:'🏪'}</div><div class="t">${esc(b.name)}</div></div>`,className:'',iconSize:[0,0]})}).addTo(mapObj)});
      msg.innerHTML=`<p class="muted sm" style="margin:0 0 8px 4px">${near.length?near.length+' business'+(near.length>1?'es':'')+' within 10 km of you':'No BT businesses near you yet. You are the first here.'}</p>`;
    }};
  },

  editProfile(){
    return {html:`${topbar('Edit profile')}
    <div style="text-align:center;margin-bottom:18px">
      <div class="ava round" style="width:88px;height:88px;border-radius:50%;margin:0 auto 10px;font-size:36px" id="editAva">${esc(initial(profile.display_name))}</div>

  username(){
    let next=null;if(profile.username_changed_at){const d=new Date(profile.username_changed_at);d.setMonth(d.getMonth()+4);if(d>new Date())next=d}
    return {html:`${topbar('Username')}<p class="muted">Your username is how people find you on BT. It must be unique.</p>
    <label class="f">Username</label><input id="un" value="${esc(profile.username)}" autocapitalize="none" autocomplete="off" ${next?'disabled':''}>
    ${next?`<div class="card sm">You changed your username recently. You can change it again on <b>${fmtDate(next)}</b>.</div>`:`<div class="muted sm" style="margin:-6px 0 12px 4px">3-20 characters: letters, numbers, underscore. You can change it once every 4 months.</div>`}
    <div class="err" id="er"></div>${next?'':'<button class="btn" id="sv">Save username</button>'}`,
    bind(){const s=$('sv');if(!s)return;s.onclick=async()=>{const n=$('un').value.trim().toLowerCase();

      if(!confirm('Change username to @'+n+'? You will not be able to change it again for 4 months.'))return;
      s.disabled=true;const {error}=await sb.rpc('change_username',{p_new:n});s.disabled=false;
      if(error){$('er').textContent=/4 months/.test(error.message)?'You can only change your username once every 4 months':'That username is taken or invalid';return}
      profile.username=n;profile.username_changed_at=new Date().toISOString();toast('Username updated');back()}}};

  security(){

    <p class="muted sm">Signed in on this device. If you use a shared phone, log out when you are done.</p><div class="menu"><button class="danger" id="lo"><i>↪</i>Log out of this device</button></div>`,

  changePassword(){
    return {html:`${topbar('Change password')}<label class="f">Current password</label><input id="cp" type="password" autocomplete="current-password">

    <div class="err" id="er"></div><button class="btn" id="sv">Update password</button>`,
    bind(){$('sv').onclick=async()=>{const cp=$('cp').value,np=$('np').value,np2=$('np2').value;
      if(!cp){$('er').textContent='Enter your current password';return}

      if(error){$('er').textContent=error.message;return}toast('Password updated');back()}}};

  blocked(){

    bind(){const load=async()=>{const {data}=await sb.from('blocks').select('blocked_id,created_at');const ids=(data||[]).map(r=>r.blocked_id);let ps=[];

};

function openLegal(k){
  const d=LEGAL[k],o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:#0B0B1A;z-index:200;overflow:auto';
  o.innerHTML=`<div class="screen plain"><div class="top"><button class="ib" id="lx">✕</button><b>${esc(d.title)}</b></div><div class="legal"><p class="muted sm">Last updated: ${d.date}</p>${d.s.map(x=>`<h3>${esc(x[0])}</h3><p>${esc(x[1])}</p>`).join('')}</div></div>`;
  document.body.appendChild(o);o.querySelector('#lx').onclick=()=>o.remove();
}
async function doLogout(){
  if(!confirm('Log out of BT on this device?'))return;
  stopWatchers();await sb.auth.signOut();remember=false;lsSet('bt_remember','0');try{localStorage.removeItem('bt_login_at')}catch{}
  me=null;profile=null;loginView();
}

privacy:{title:'Privacy Policy',date:'16 November 2026',s:[
['Who we are','BT (Business Tracker) is a local business discovery and community platform that connects people with businesses they visit in the physical world. In this policy, "BT", "we" and "us" means the BT team. Contact: '+SUPPORT_EMAIL+'.'],
['What this policy covers','This policy explains what personal information BT collects, why, who we share it with, and the choices you have. We process personal data in line with the Nigeria Data Protection Act 2023 (NDPA).'],
['Information you give us','When you sign up we collect your name, username, email address, password (stored securely, never readable by us) and date of birth. Your date of birth is used only to confirm you are at least 16 and is not shown to other users. Business accounts also give us the business name, category, description, address and map location. You may add a bio, memories, stories, messages and other content you choose to post.'],
['Information collected when you use BT','When you check in at a business we process your device location and the business QR code to confirm you are present, and we record the visit and the EXP awarded. We keep your EXP, status, follows, blocks and settings. When you open the map, your device location is used on your phone and sent to us only to find businesses near you; it is not stored. We keep basic technical data such as sign-in times, the devices you sign in on, and security logs to protect the service.'],
['How we use information','To create and secure your account; to verify visits and award EXP; to show businesses near you and on the map; to run communities, messaging and stories; to verify businesses and review reports; to prevent fraud and abuse; to send service emails such as confirmation codes; and to improve BT.'],
['What other people can see','Your name, username, bio, status and follower information may be visible to other users. Your visit history, memories and Where You\'ve Been entries are private to you unless you choose to share them. Stories are visible only to the followers or people you share them with. Businesses see follower counts and may see aggregate visit activity; they do not see your private details.'],
['Who we share data with','We do not sell your personal data. We use trusted service providers that process data for us: Supabase (database and sign-in), Cloudinary (photo and video storage and delivery), Brevo (sending emails), GitHub (hosting this web app) and OpenStreetMap (map tiles). We may disclose information if the law requires it or to protect users and BT from harm.'],
['Where data is stored','Our providers may store and process data outside Nigeria. Where that happens we rely on providers that apply appropriate safeguards.'],
['How long we keep data','We keep your data while your account is active. If you delete your account we delete or anonymise your personal data, except where we must keep limited records for security, fraud prevention or legal reasons.'],
['Security','Access to data is restricted by account-level security rules, connections are encrypted, and passwords are hashed. No system is perfectly secure, so please use a strong, unique password and log out on shared devices.'],
['Your rights','You can ask to access, correct, delete or export your data, to object to or restrict certain processing, and to withdraw consent. Email '+SUPPORT_EMAIL+' and we will respond within a reasonable time. You may also complain to the Nigeria Data Protection Commission.'],
['Age','BT is for people aged 16 and over. If we learn that someone under 16 has an account, we will remove it.'],
['Changes','We may update this policy as BT grows. We will update the date above and, for important changes, notify you in the app.']]},
terms:{title:'Terms of Use',date:'16 November 2026',s:[
['Welcome','By creating an account or using BT you agree to these terms. If you do not agree, please do not use BT.'],
['Who can use BT','You must be at least 16 years old and give accurate information. You are responsible for your account and for keeping your password safe. One person may not run multiple accounts to gain EXP or status.'],
['What BT is','BT is a discovery and community platform. It is not an online shop. BT does not sell goods on behalf of businesses and is not a party to any purchase between you and a business.'],
['Check-ins and EXP','EXP is awarded only for genuine, verified visits made in person by scanning a business QR code at the location. Scan limits apply per business type, and visits beyond the limit earn no EXP. Cheating, including fake locations, sharing or copying QR codes, scripts or bots, may lead to EXP removal, suspension or a ban. EXP and status have no cash value.'],
['Your content','You own what you post, but you give BT permission to host, display and deliver it as part of the service. Only post content you have the right to share. Do not post anything illegal, hateful, harassing, sexual involving minors, misleading, infringing, or that exposes someone else\'s private information.'],
['Businesses','Businesses are reviewed before they appear on BT. Business accounts must give true details, may only post promotional content about their own business, and must follow the posting rules we set. We may remove content, hide a business or suspend an account that breaks these rules or the law.'],
['Messaging and safety','You can block anyone at any time. Do not spam, threaten or impersonate others. We may review reports and take action, including removing content or accounts.'],
['Hierarchy and sponsored features','Status titles and any paid or sponsored features, when available, are governed by the extra rules shown in the app at that time.'],
['Availability','BT is in early access. We may change, pause or remove features, and the service may sometimes be unavailable. We do our best but do not promise it will always be error-free.'],
['Suspension and ending','You can stop using BT and ask us to delete your account at any time. We may suspend or end accounts that break these terms or put others at risk.'],
['Liability','BT is provided "as is". To the extent the law allows, BT is not responsible for what businesses or other users say or do, or for losses from dealings between you and a business. Nothing in these terms limits rights you have under Nigerian law that cannot be limited.'],
['Governing law','These terms are governed by the laws of the Federal Republic of Nigeria.'],
['Contact','Questions about these terms: '+SUPPORT_EMAIL+'.']]},
cookies:{title:'Cookie Policy',date:'16 November 2026',s:[
['Summary','BT keeps this simple. We use only the browser storage that is needed to run the service. We do not use advertising or tracking cookies.'],
['What we store','When you sign in, your browser stores a session token so you stay signed in. If you tick "Remember me" it is kept on your device for up to '+SESSION_DAYS+' days. If you do not, it is cleared when you close the browser. We also store your "Remember me" choice.'],
['Third parties','Map tiles are loaded from OpenStreetMap, and media and fonts may be delivered by content networks. These providers may see your IP address when your device requests their files.'],
['Your choices','You can log out at any time to clear your session. You can also clear site data in your browser settings. Blocking essential storage will stop you from staying signed in.'],
['Contact','Questions: '+SUPPORT_EMAIL+'.']]}
};

/* ---------- boot ---------- */
(async()=>{
  splash();await wait(1200);
  if(recovering)return;
  // purge old long-lived sessions that were never opted in via "Remember me"
  if(!remember){try{Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k))}catch{}}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginView();return}
  if(remember){const at=Number(lsGet('bt_login_at')||0);
    if(!at||Date.now()-at>SESSION_DAYS*86400000){await sb.auth.signOut();loginView('Please log in again.');return}}
  startApp();
})();
</script>
</body>
</html>
