<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A22">
<title>BT - Business Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0B0B1A;--s1:#14142A;--s2:#1B1B38;--line:rgba(167,139,250,.18);--violet:#7C3AED;--vl:#A78BFA;--text:#F3F0FF;--muted:#9A98B8;--red:#ff6b6b;--green:#4ade80}

/* r13b: BT original navy-violet blended with logo purple + electric accents (all screens except Home) */
body.nh{--bg:#0C0A22;--s1:#16123A;--s2:#221A54;--line:rgba(150,130,255,.22);--violet:#7A1FFF;--vl:#B79CFF;--text:#F5F2FF;--muted:#A9A3D6;--hot:#E040FB;--ice:#5EC8FF;--gold:#FFC857;
background:radial-gradient(760px 460px at 88% -8%,rgba(122,31,255,.42),transparent 62%),radial-gradient(620px 420px at -12% 32%,rgba(75,0,130,.5),transparent 62%),radial-gradient(520px 360px at 60% 112%,rgba(224,64,251,.16),transparent 65%),var(--bg);background-attachment:fixed}
body.nh .btn,body.nh .sendb,body.nh .msg.me,body.nh .pulse{background:linear-gradient(135deg,#5A0FB8 0%,#7A1FFF 55%,#B14DFF 100%);box-shadow:0 6px 18px rgba(122,31,255,.35),inset 0 1px 0 rgba(255,255,255,.22)}
body.nh .btn.ghost{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.02)),var(--s1);box-shadow:none}
body.nh .mapb,body.nh nav button.plus{background:linear-gradient(135deg,#5A0FB8,#7A1FFF 55%,#E040FB);box-shadow:0 8px 24px rgba(160,60,255,.5),inset 0 1px 0 rgba(255,255,255,.3)}
body.nh nav{background:linear-gradient(180deg,rgba(22,18,58,.92),rgba(12,10,34,.98));border-top:1px solid rgba(150,130,255,.28)}
body.nh nav button.on{color:#fff}
body.nh nav button.on span{filter:drop-shadow(0 0 8px rgba(183,156,255,.9))}
body.nh .badge{background:linear-gradient(135deg,#7A1FFF,#E040FB);box-shadow:0 0 0 2px var(--bg)}
body.nh .ib{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),var(--s1)}
body.nh .ava{background:linear-gradient(135deg,rgba(122,31,255,.35),rgba(224,64,251,.18))}
body.nh .ava.round,body.nh .ring{background:linear-gradient(135deg,#7A1FFF,#E040FB 60%,#FFC857)}
body.nh .bar i,body.nh .steps i.on{background:linear-gradient(90deg,#7A1FFF,#E040FB,#FFC857)}
body.nh .cover{background:linear-gradient(135deg,#1c0a4a,#4B0082 45%,#7A1FFF 75%,#E040FB)}
body.nh .card{background:linear-gradient(160deg,rgba(122,31,255,.2),rgba(22,18,58,.92) 60%);border-color:rgba(150,130,255,.26);box-shadow:0 8px 24px rgba(5,3,24,.35),inset 0 1px 0 rgba(255,255,255,.06)}
body.nh .menu,body.nh .bc{box-shadow:0 6px 20px rgba(5,3,24,.3)}
body.nh .ring2 .in,body.nh .pin .c{background:#16123A}
body.nh .pin .c{border-color:#B14DFF}
body.nh .chips button.on,body.nh .hbadge{background:rgba(122,31,255,.3);border-color:#9B5CFF;color:#E7DCFF}
body.nh .seg button.on{border-bottom-color:#B14DFF}
body.nh input:focus,body.nh select:focus,body.nh textarea:focus{border-color:#9B5CFF;box-shadow:0 0 0 3px rgba(122,31,255,.25)}
body.nh .pill{background:rgba(94,200,255,.14);color:#8fdcff}
body.nh .link,body.nh .sec button{color:#C9B3FF}
body.nh .logo{border-radius:26px;box-shadow:0 12px 40px rgba(150,60,255,.55)}
body.nh .logo.s{border-radius:11px;box-shadow:none}

/* r14: "money" finish — royal violet + gold, applied app-wide */
body.nh{--gold:#F5C451;--gold2:#FFB547;--gold-g:linear-gradient(135deg,#FFE08A,#F5C451 45%,#D99A1E)}
body.nh .q4 button{background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--s1);border-color:rgba(245,196,81,.22)}
body.nh .q4 button i{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px rgba(5,3,24,.35)}
body.nh .q4 button i.p{background:linear-gradient(135deg,#5A0FB8,#9B5CFF)}
body.nh .q4 button i.g{background:linear-gradient(135deg,#0E7C66,#2FD6A3)}
body.nh .q4 button i.b{background:linear-gradient(135deg,#2B4BD6,#5EC8FF)}
body.nh .q4 button i.y{background:var(--gold-g)}
body.nh nav button.on{color:var(--gold)}
body.nh nav button.on span{filter:drop-shadow(0 0 8px rgba(245,196,81,.8))}
body.nh nav button.plus{background:var(--gold-g);color:#2a1552;box-shadow:0 8px 24px rgba(245,196,81,.45),inset 0 1px 0 rgba(255,255,255,.5)}
body.nh .mapb{background:var(--gold-g);color:#2a1552;box-shadow:0 6px 18px rgba(245,196,81,.35)}
body.nh .badge{background:var(--gold-g);color:#2a1552}
body.nh .pill{background:rgba(245,196,81,.16);color:#FFD97A;border:1px solid rgba(245,196,81,.3)}
body.nh .hero h2 span,body.nh .vl{color:#FFD97A}
body.nh .sec b{background:linear-gradient(90deg,#fff,#FFE9B0);-webkit-background-clip:text;background-clip:text;color:transparent}
body.nh .sec button,body.nh .link{color:var(--gold)}
body.nh .bar i,body.nh .steps i.on{background:linear-gradient(90deg,#7A1FFF,#E040FB 55%,#F5C451)}
body.nh .ava.round,body.nh .ring{background:linear-gradient(135deg,#7A1FFF,#E040FB 50%,#F5C451)}
body.nh .profile-head .ava{border-color:var(--gold)}
body.nh .chips button.on,body.nh .hbadge{background:linear-gradient(135deg,rgba(122,31,255,.4),rgba(245,196,81,.2));border-color:var(--gold);color:#FFE9B0}
body.nh .seg button.on{border-bottom-color:var(--gold)}
body.nh .card{border-color:rgba(245,196,81,.2)}
body.nh .bc{border-color:rgba(245,196,81,.2)}
body.nh .bc .badge-st{color:var(--gold);border-color:rgba(245,196,81,.35)}
body.nh .menu button i{filter:drop-shadow(0 0 6px rgba(245,196,81,.35))}
body.nh .btn:not(.ghost){background:linear-gradient(135deg,#4B0082 0%,#7A1FFF 60%,#A84DFF);box-shadow:0 6px 18px rgba(122,31,255,.4),inset 0 1px 0 rgba(255,255,255,.25),0 0 0 1px rgba(245,196,81,.25)}
body.nh .logo{box-shadow:0 12px 40px rgba(245,196,81,.35),0 0 0 2px rgba(245,196,81,.35)}
body.nh .tg{background:var(--gold-g);color:#2a1552;border-radius:8px;padding:1px 7px;font-weight:800}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,rgba(124,58,237,.28),transparent 60%),radial-gradient(700px 400px at -10% 30%,rgba(76,29,149,.25),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.screen{max-width:480px;margin:0 auto;padding:16px 16px 110px;min-height:100vh}
.screen.plain{padding-bottom:30px}
.muted{color:var(--muted)} .vl{color:var(--vl)} .sm{font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.top b{font-size:18px;flex:1}
.ib{width:40px;height:40px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;flex:none}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--violet);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
input,select,textarea{width:100%;background:var(--s1);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:15px 14px;font:inherit;font-size:16px;margin:0 0 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 4px}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px;font-size:15px}
label.chk input{width:20px;height:20px;margin:0;flex:none}
.btn{width:100%;background:linear-gradient(135deg,#7C3AED,#9F67FF);color:#fff;border-radius:14px;padding:15px;font-size:16px;font-weight:700;text-align:center}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--s1);border:1px solid var(--line)}
.btn.sm2{width:auto;padding:10px 16px;font-size:14px;border-radius:12px}
.btn.visit{width:100%;padding:10px;font-size:14px;border-radius:12px;margin-top:8px}
.link{color:var(--vl);padding:12px;font-size:15px}
.err{color:var(--red);font-size:14px;margin:2px 0 12px;min-height:1px}
.ok{color:var(--green);font-size:14px;margin:2px 0 12px}
.card{background:linear-gradient(160deg,rgba(124,58,237,.14),rgba(20,20,42,.9));border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{padding:0;overflow:hidden;position:relative;min-height:160px;display:flex;flex-direction:column;justify-content:flex-end}
.hero .hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,rgba(76,29,149,.85),rgba(124,58,237,.6)),url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200"><rect fill="%231a1035" width="400" height="200"/></svg>');background-size:cover;background-position:center}
.hero .hero-body{position:relative;padding:18px 16px 16px;z-index:1}
.pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(167,139,250,.2);color:var(--vl);margin-bottom:8px;font-weight:600}
.hero h2{margin:0 0 6px;font-size:22px;line-height:1.25;font-weight:800}
.hero h2 span{color:var(--vl)}
.hero p{margin:0 0 12px;color:rgba(243,240,255,.85);font-size:13px;line-height:1.4}
.q4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.q4 button{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;font-size:11px;text-align:center;line-height:1.25;font-weight:600}
.q4 button i{display:block;font-style:normal;font-size:24px;margin-bottom:8px;width:42px;height:42px;line-height:42px;border-radius:14px;margin-left:auto;margin-right:auto}
.q4 button i.p{background:rgba(124,58,237,.25)}
.q4 button i.g{background:rgba(74,222,128,.2)}
.q4 button i.b{background:rgba(96,165,250,.2)}
.q4 button i.y{background:rgba(250,204,21,.2)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.sec b{font-size:17px} .sec button{color:var(--vl);font-size:13px;font-weight:600}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.bc{flex:none;width:160px;background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left}
.bc .img{height:100px;background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(20,20,42,1));display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;position:relative}
.bc .img img{width:100%;height:100%;object-fit:cover}
.bc .badge-st{position:absolute;bottom:6px;left:6px;font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(11,11,26,.85);color:var(--vl);font-weight:700;border:1px solid var(--line)}
.bc .t{padding:10px 10px 12px}
.nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:12px;align-items:center}
.ava{width:48px;height:48px;border-radius:14px;background:rgba(124,58,237,.3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:20px}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.round{border-radius:50%;background:linear-gradient(135deg,#7C3AED,#C4B5FD);font-weight:800;color:#fff}
.grow{flex:1;min-width:0}
.bar{height:8px;border-radius:8px;background:var(--bg);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7C3AED,#A78BFA);border-radius:8px}
.srch{display:flex;gap:10px;margin-bottom:14px}
.srch input{margin:0;border-radius:16px;padding:13px 14px}
.mapb{flex:none;width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,#7C3AED,#A78BFA);font-size:20px;display:flex;align-items:center;justify-content:center}
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(15,15,32,.97);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
nav .in{max-width:480px;margin:0 auto;display:flex;align-items:center;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;color:var(--muted);font-size:10px;padding:6px 0;font-weight:600}
nav button span{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--vl)}
nav button.plus{flex:none;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#A78BFA);color:#fff;font-size:28px;margin:-24px 6px 0;box-shadow:0 8px 24px rgba(124,58,237,.55)}
.evcard{display:flex;gap:12px;align-items:center}
.evdate{flex:none;width:48px;text-align:center;background:rgba(124,58,237,.2);border-radius:12px;padding:8px 4px}
.evdate b{display:block;font-size:18px;line-height:1.1}
.evdate span{font-size:11px;color:var(--vl);font-weight:700}
.header-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.header-row .brand{flex:1}
.header-row .brand b{font-size:20px;display:block}
.header-row .brand .tag{font-size:11px;color:var(--muted);letter-spacing:.3px}
.menu{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
.menu button{width:100%;display:flex;align-items:center;gap:14px;padding:15px 16px;text-align:left;font-size:16px;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu button i{font-style:normal;width:24px;text-align:center;font-size:18px}
.menu button em{margin-left:auto;font-style:normal;color:var(--muted)}
.menu button.danger{color:var(--red)}
.mh{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:20px}
.logo{border-radius:20px;width:130px;height:130px}
.logo.s{width:40px;height:40px;border-radius:10px}
.seg{display:flex;gap:0;margin:0 -16px 14px;border-bottom:1px solid var(--line);padding:0 16px}
.seg button{flex:1;padding:14px 8px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--text);border-bottom-color:var(--violet)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:600}
.chips button.on{background:rgba(124,58,237,.25);border-color:var(--violet);color:var(--vl)}
.vid{position:relative;border-radius:16px;overflow:hidden;background:var(--s2);aspect-ratio:9/14;margin-bottom:12px}
.vid .thumb{width:100%;height:100%;background:linear-gradient(160deg,rgba(124,58,237,.4),rgba(20,20,42,.95));display:flex;align-items:center;justify-content:center;font-size:48px}
.vid .meta{position:absolute;left:0;right:0;bottom:0;padding:14px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.vid .meta .nm{font-size:14px}
.vid-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats-row{display:flex;justify-content:center;gap:28px;margin:14px 0 6px}
.stats-row div{text-align:center}
.stats-row b{display:block;font-size:18px}
.stats-row span{font-size:12px;color:var(--muted)}
.profile-head{text-align:center;padding:8px 0 4px}
.profile-head .ava{margin:0 auto 12px;border:3px solid var(--violet)}
.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--s2)} .steps i.on{background:var(--violet)}
#map{height:calc(100vh - 150px);border-radius:18px;border:1px solid var(--line)}
.pin{display:flex;flex-direction:column;align-items:center;width:110px;margin-left:-55px}
.pin .c{width:42px;height:42px;border-radius:50%;border:3px solid #7C3AED;background:#16162B;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pin .c img{width:100%;height:100%;object-fit:cover}
.pin .t{background:rgba(11,11,26,.9);font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;margin-top:2px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legal h3{font-size:16px;margin:20px 0 6px;color:var(--vl)}
.legal p{margin:0 0 8px;line-height:1.55;color:#d9d5ee;font-size:15px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:90%}
.lad{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty i{display:block;font-style:normal;font-size:44px;margin-bottom:10px}

.ava.xl{width:96px;height:96px;font-size:38px}
.ava.sm{width:40px;height:40px;font-size:16px}
.ava.sq{border-radius:22px}
.srchwrap{position:relative}
.sdrop{position:absolute;left:0;right:0;top:100%;margin-top:-8px;background:var(--s1);border:1px solid var(--line);border-radius:16px;z-index:60;max-height:62vh;overflow:auto;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.sr{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0}
.sdrop .sr:active,.sr:active{background:rgba(124,58,237,.15)}
.tg{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(167,139,250,.18);color:var(--vl);vertical-align:middle}
.cover{height:120px;border-radius:20px;background:linear-gradient(135deg,#2E1065,#7C3AED 65%,#A78BFA)}
.pavw{margin:-48px 0 8px;display:flex;justify-content:center}
.pavw .ava{border:4px solid var(--bg);box-shadow:0 0 0 2px var(--violet)}
.acts{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.acts .btn{flex:1}
.ibx{flex:none;width:50px;height:50px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center}
.ibx.on{border-color:var(--violet);background:rgba(124,58,237,.25)}
.plusb{position:absolute;right:-2px;bottom:6px;width:28px;height:28px;border-radius:50%;background:var(--violet);border:3px solid var(--bg);font-size:14px;display:flex;align-items:center;justify-content:center}
.chipb{margin-top:12px;padding:8px 16px;border-radius:20px;background:var(--s1);border:1px solid var(--line);font-size:14px}
.menu-one{width:100%;display:flex;align-items:center;gap:8px;padding:15px 16px;background:var(--s1);border:1px solid var(--line);border-radius:18px;font-size:15px;text-align:left;margin-bottom:6px}
.menu-one em{margin-left:auto;font-style:normal;color:var(--muted)}
.chead{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;margin:-16px -16px 6px;padding:14px 12px 16px;background:linear-gradient(135deg,#1c0a4a,#4B0082 70%,#6a1fe0);border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(5,3,24,.5);color:#fff}
.chead .ib{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.chead .nm{font-size:17px;font-weight:800}.chead .muted{color:#E3D4FF}
.chead .ava{border:2px solid #E9D8FF}
.msgs{padding:10px 0 96px;min-height:50vh}
.day{align-self:center;text-align:center;margin:12px auto;width:max-content;padding:5px 14px;border-radius:14px;background:#2a1552;font-size:12px;font-weight:700;color:#D5C8F5}
.mline{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.mrow.me .mline{flex-direction:row-reverse}
.mline .ava{width:34px;height:34px;border-radius:50%;font-size:14px;flex:none}
.mcol{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.mrow.me .mcol{align-items:flex-end}
.mrow{display:flex;flex-direction:column;align-items:flex-start;margin:10px 0}
.mrow.me{align-items:flex-end}

.mact{display:flex;gap:12px;margin:2px 44px 0}

.composer .in{max-width:480px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}

body.chat,body.chat.nh{background:#000!important}

.sendb{flex:none;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#9F67FF);color:#fff;font-size:18px}
.rbar{align-items:center;justify-content:space-between;gap:8px;background:var(--s2);border-left:3px solid var(--vl);padding:6px 10px;border-radius:8px;font-size:12px;color:var(--muted)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--s1);border-radius:22px 22px 0 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet button{display:block;width:100%;padding:16px;font-size:16px;text-align:center;border-bottom:1px solid var(--line)}
.sheet button.danger{color:var(--red)}
.sheet button.cancel{color:var(--muted);border-bottom:0}

/* round 7 */
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;margin-bottom:14px;border-radius:18px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;scroll-snap-align:start;min-height:170px;padding:18px 16px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;border-radius:18px;border:1px solid var(--line)}
.slide{position:relative;overflow:hidden}.slide>video,.slide>.sbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.slide>.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,26,.05),rgba(11,11,26,.85));z-index:0}.slide>*:not(video):not(.sbg):not(.sh){position:relative;z-index:1}.slide h2{margin:6px 0 4px;font-size:22px;line-height:1.25;font-weight:800}

.picker{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--s1);padding:6px}
.picker .ph{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--vl);padding:10px 8px 4px}

.picker .opt.on{background:rgba(124,58,237,.25);color:var(--vl);font-weight:700}
.proof{height:170px;border:1px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;background:var(--s1)}

.stt .sm{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#C4B5FD);display:inline-block}
.ring.seen{background:var(--line)} .ring.none{background:transparent;border:2px dashed var(--line)}
.ring .ava{border:2px solid var(--bg)}
.plusb2{position:absolute;right:6px;top:36px;width:22px;height:22px;border-radius:50%;background:var(--violet);color:#fff;font-size:15px;line-height:22px;text-align:center;border:2px solid var(--bg)}
.sview{position:fixed;inset:0;background:#000;z-index:250;color:#fff;display:flex;flex-direction:column}
.sbars{display:flex;gap:4px;padding:10px 10px 6px}
.sbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;display:block}

.shead{display:flex;align-items:center;gap:10px;padding:4px 12px}.shead button{color:#fff;font-size:20px;padding:6px 10px}

/* ===== Round 8: friendlier, warmer look (same violet on navy) ===== */

/* Media limits — free-plan friendly (both customers & businesses) */
const MAX_VIDEO_MB = 100;
const MAX_VIDEO_SEC = 180; // 3 minutes
const MAX_IMAGE_MB = 10;

/** Read video duration (seconds) via a temporary <video> element */
function getVideoDuration(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.preload='metadata';
    v.onloadedmetadata=()=>{URL.revokeObjectURL(url); resolve(v.duration||0);};
    v.onerror=()=>{URL.revokeObjectURL(url); reject(new Error('Could not read video'));};
    v.src=url;
  });
}

/**
 * Validate image/video before upload.
 * Videos: max 100 MB and max 3 minutes.
 * Images: max 10 MB.
 */
async function validateMediaFile(file, {allowVideo=true, allowImage=true}={}){
  if(!file) return 'Choose a file first';
  const isVid=file.type.startsWith('video/');
  const isImg=file.type.startsWith('image/');
  if(isVid && !allowVideo) return 'Video is not allowed here';
  if(isImg && !allowImage) return 'Image is not allowed here';
  if(!isVid && !isImg) return 'Only photos or videos are allowed';
  const mb=file.size/(1024*1024);
  if(isImg && mb>MAX_IMAGE_MB) return `Photo must be under ${MAX_IMAGE_MB} MB (yours is ${mb.toFixed(1)} MB)`;
  if(isVid && mb>MAX_VIDEO_MB) return `Video must be under ${MAX_VIDEO_MB} MB (yours is ${mb.toFixed(1)} MB). Try a shorter clip or lower quality.`;
  if(isVid){
    try{
      const sec=await getVideoDuration(file);
      if(sec>MAX_VIDEO_SEC+0.5) return `Video must be 3 minutes or less (yours is ${Math.ceil(sec/60)} min ${Math.round(sec%60)}s)`;
    }catch{
      return 'Could not read that video. Try another file (mp4 recommended).';
    }
  }
  return null; // ok
}

/**
 * Upload to Cloudinary (unsigned preset).
 * For videos we request a 720p-friendly delivery URL when possible.
 * resourceType: 'image' | 'video' | 'auto'
 */
async function uploadToCloudinary(file, resourceType='image'){
  if(!CLOUDINARY_CLOUD || !CLOUDINARY_PRESET){
    toast('Cloudinary not configured yet');
    return null;
  }
  const fd=new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLOUDINARY_PRESET);
  // NOTE: unsigned uploads do not accept transformation params; limits live in the Cloudinary preset.
  const endpoint=`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/${resourceType}/upload`;
  const res=await fetch(endpoint,{method:'POST',body:fd});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    const msg=data.error&&data.error.message?data.error.message:'Cloudinary upload failed';
    throw new Error(msg);
  }
  const base=data.secure_url||data.url||null;
  if(!base||!base.startsWith('https://res.cloudinary.com/')) return null;
  // deliver a 720p / 1080px version so free-plan bandwidth stays healthy
  const t=resourceType==='video'?'c_limit,w_1280,h_720,q_auto:good':'c_limit,w_1080,q_auto,f_auto';
  return base.replace('/upload/','/upload/'+t+'/');
}

function deviceLabel(){

}

/* ---------- location ---------- */
function getPos(){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>{geo={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};res(geo)},()=>res(null),{enableHighAccuracy:true,timeout:15000,maximumAge:20000});
})}
const km=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km';
const hav=(a,b,c,d)=>{const R=6371000,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),h=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function nearbyFor(pos,radius=10000){
  const {data,error}=await sb.rpc('nearby_businesses',{p_lat:pos.lat,p_lng:pos.lng,p_radius:radius,p_limit:60});
  if(!error&&data)return data;
  // fallback until bt_step4.sql is installed: filter the list on the phone
  return businesses.filter(b=>b.lat!=null&&b.lng!=null).map(b=>({...b,distance_m:hav(pos.lat,pos.lng,b.lat,b.lng)})).filter(b=>b.distance_m<=radius).sort((x,y)=>x.distance_m-y.distance_m);
}
async function nearbyIfAllowed(){
  try{
    if(!navigator.permissions)return;
    const st=await navigator.permissions.query({name:'geolocation'});
    if(st.state!=='granted')return;
    const pos=await getPos();if(!pos)return;
    const near=await nearbyFor(pos);
    if(near.length){businesses=near;if(cur.name==='home')draw()}
  }catch{}
}

  if(profile.role==='business'&&!myBiz){bizWizard(1);return}

/** Get current GPS once (for check-in) */
function getLatLng(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res({lat:null,lng:null});
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      ()=>res({lat:null,lng:null}),
      {enableHighAccuracy:true,timeout:12000,maximumAge:30000}
    );
  });
}

/** Parse a scanned QR and try check-in / open profile */
async function handleScannedQR(raw){
  const box=$('scanResult');
  const render=(html)=>{ if(box){ box.style.display='block'; box.innerHTML=html; } };
  let data=null;
  try{ data=JSON.parse(raw); }catch{}
  // BT business QR — needs business id + token + GPS (matches Supabase check_in)
  if(data && data.t==='bt_biz' && data.id){
    render(`<b>Business found</b><div class="nm" style="margin-top:6px">${esc(data.name||'Business')}</div>
      <p class="muted sm">Getting location & checking in…</p>`);
    const {lat,lng}=await getLatLng();
    if(lat==null||lng==null){
      render(`<b>Location needed</b><div class="nm" style="margin-top:6px">${esc(data.name||'Business')}</div>
        <p class="muted sm">BT checks that you are at the business. Turn on location for this site, then scan again.</p>
        <button class="btn sm2" style="margin-top:10px" id="qrAgain2">Scan again</button>`);
      const a2=$('qrAgain2'); if(a2) a2.onclick=()=>window.__btShow&&window.__btShow('scanner');

        p_token: token,
        p_lat: lat,
        p_lng: lng
      });
      if(error) throw error;
      const row = Array.isArray(result) ? result[0] : result;
      const awarded = row?.awarded ?? row?.awarded_exp ?? 100;
      const msg = row?.result_message || row?.message || 'Check-in recorded';
      const before=profile.global_exp||0;
      if(awarded>0)profile.global_exp=before+awarded;
      celebrate(data.name||'',awarded,msg,before);
      render(`<b class="ok">Checked in ✓</b><div class="nm" style="margin-top:6px">${esc(data.name||'')}</div>
        <p class="muted sm">${esc(msg)} · +${awarded} EXP</p>

      const h=$('qrHome'); if(h) h.onclick=()=>window.__btShow&&window.__btShow('home');
    }catch(e){

      render(`<b>Business QR</b><div class="nm" style="margin-top:6px">${esc(data.name||data.id)}</div>

        <button class="btn sm2" style="margin-top:10px" id="qrHome2">OK</button>`);
      const h=$('qrHome2'); if(h) h.onclick=()=>window.__btShow&&window.__btShow('home');
      toast('Check-in failed');
    }
    return;
  }
  // BT user QR: open their profile
  if(data && data.t==='bt_user' && UUID.test(String(data.id||''))){ window.__btShow&&window.__btShow('profile',{id:data.id}); return; }
  // Plain text / unknown
  render(`<b>Scanned</b><p class="muted sm" style="word-break:break-all;margin-top:8px">${esc(String(raw).slice(0,200))}</p>
    <p class="muted sm">Not a BT business QR.</p>
    <button class="btn sm2" style="margin-top:10px" id="qrAgain">Scan again</button>`);
  const ag=$('qrAgain'); if(ag) ag.onclick=()=>window.__btShow&&window.__btShow('scanner');
}

/* ---------- check-in celebration ---------- */
function celebrate(name,awarded,msg,before){
  const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const win=awarded>0,after=(before||0)+awarded,s0=statusFor(before||0),s1=statusFor(after);
  const pctOf=(e,s)=>s.next?Math.min(100,Math.max(0,(e-s.from)/(s.next-s.from)*100)):100;
  const ranked=s1.n!==s0.n;
  const o=document.createElement('div');o.className='cel';
  const bits=win&&!calm?Array.from({length:26},(_,i)=>`<i style="--x:${(Math.random()*100).toFixed(0)}%;--d:${(Math.random()*.6).toFixed(2)}s;--r:${Math.floor(Math.random()*360)}deg;--c:${['#FFB547','#A78BFA','#7C3AED','#F3F0FF','#4ade80'][i%5]}"></i>`).join(''):'';
  o.innerHTML=`<div class="confetti">${bits}</div><div class="cbody">
    <div class="pulse ${win?'':'calm'}"><svg viewBox="0 0 52 52" width="64" height="64"><circle cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="3" opacity=".35"/>${win?'<path d="M14 27l8 8 16-17" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="tick"/>':'<path d="M26 14v13l8 5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>'}</svg></div>
    <h2>${win?'You’re checked in!':'Visit logged'}</h2><div class="cn">${esc(name)}</div>
    ${win?`<div class="gain"><span id="cexp">0</span><small> EXP</small></div>`:''}
    <div class="cm">${esc(msg)}</div>
    ${win?`<div class="cprog"><div class="row2"><b>${esc(s1.n)}</b><span class="muted sm">${s1.next?(s1.next-after).toLocaleString()+' EXP to next rank':'Top rank'}</span></div><div class="bar"><i id="cbar" style="width:${pctOf(before||0,s0)}%"></i></div></div>`:''}
    ${ranked?`<div class="rankup">🎉 Rank up! You are now <b>${esc(s1.n)}</b></div>`:''}
    <button class="btn" id="cok">${win?'Awesome':'OK'}</button></div>`;
  document.body.appendChild(o);
  try{if(win&&navigator.vibrate)navigator.vibrate([30,40,30])}catch{}
  const close=()=>{o.classList.add('out');setTimeout(()=>{o.remove();if(typeof show==='function')show('home')},200)};
  o.querySelector('#cok').onclick=close;
  if(win){
    const el=o.querySelector('#cexp'),t0=performance.now(),dur=calm?1:900;
    const tick=t=>{const k=Math.min(1,(t-t0)/dur);el.textContent='+'+Math.round(awarded*(1-Math.pow(1-k,3)));if(k<1&&document.body.contains(o))requestAnimationFrame(tick)};requestAnimationFrame(tick);
    setTimeout(()=>{const b=o.querySelector('#cbar');if(b)b.style.width=(ranked?100:pctOf(after,s1))+'%'},350);
  }
}

/* ---------- QR download (poster PDF / image) ---------- */
function qrSource(payload,size){return new Promise(res=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(d);
  new QRCode(d,{text:payload,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});
  setTimeout(()=>{const c=d.querySelector('canvas');const out=document.createElement('canvas');out.width=out.height=size;out.getContext('2d').drawImage(c,0,0);d.remove();res(out)},60)})}
async function qrPoster({payload,heading,sub,name,note}){
  const W=1240,H=1754,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const F='Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif',ctr=(t,y,font,col)=>{g.font=font;g.fillStyle=col;g.textAlign='center';g.fillText(t,W/2,y)};
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,W,340);gr.addColorStop(0,'#2a0a55');gr.addColorStop(1,'#7A1FFF');g.fillStyle=gr;g.fillRect(0,0,W,340);
  g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.roundRect(W/2-56,56,112,112,30);g.fill();
  ctr('BT',140,`800 56px ${F}`,'#fff');ctr('Business Tracker',232,`700 36px ${F}`,'#EDE9FE');ctr('Discover • Grow • Succeed',286,`600 26px ${F}`,'#C4B5FD');
  ctr(heading,470,`800 84px ${F}`,'#1B1535');ctr(sub,540,`600 38px ${F}`,'#6B6590');
  const size=720,q=await qrSource(payload,size),x=(W-size)/2,y=590;
  g.fillStyle='#fff';g.strokeStyle='#4B0082';g.lineWidth=10;g.beginPath();g.roundRect(x-40,y-40,size+80,size+80,40);g.fill();g.stroke();g.drawImage(q,x,y);
  let nm=name,fs=70;g.font=`800 ${fs}px ${F}`;while(g.measureText(nm).width>W-160&&fs>34){fs-=4;g.font=`800 ${fs}px ${F}`}
  ctr(nm,y+size+135,`800 ${fs}px ${F}`,'#1B1535');
  ctr(note,y+size+195,`600 34px ${F}`,'#6B6590');
  g.fillStyle='#F5F3FF';g.fillRect(0,H-190,W,190);
  ctr('Open the BT app → tap the center ＋ → Scan',H-100,`700 36px ${F}`,'#4C1D95');
  return c}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function loadJsPDF(){return window.jspdf?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load the PDF tool. Check your internet or use the image option.'));document.head.appendChild(s)})}
async function downloadQr(kind,opts){
  const base='BT-QR-'+String(opts.name||'code').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,40);
  toast('Preparing…');
  try{const c=await qrPoster(opts);
    if(kind==='png'){c.toBlob(b=>{if(!b){toast('Could not make the image');return}saveBlob(b,base+'.png');toast('Image saved')},'image/png');return}
    await loadJsPDF();const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,210,297);pdf.save(base+'.pdf');toast('PDF saved')

    async bind(){

        if(isBiz){
          const {data, error}=await sb.rpc('my_qr_token');
          if(error) throw error;
          const token = typeof data==='string' ? data : (data && (data.token||String(data)));
          payload = JSON.stringify({t:'bt_biz', id: myBiz.id, token: token, name: myBiz.name});
          $('qrMeta').textContent = 'Token ready · customers need GPS on to check in';
        } else {
          payload = JSON.stringify({t:'bt_user', id: me.id, u: profile.username});
          $('qrMeta').textContent = payload;
        }
      }catch(e){
        payload = isBiz
          ? JSON.stringify({t:'bt_biz', id: myBiz.id, token: '', name: myBiz.name})
          : JSON.stringify({t:'bt_user', id: me.id, u: profile.username});
        $('qrMeta').textContent = 'Could not load my_qr_token — run Supabase SQL / check business account';
      }
      box.innerHTML='';

        new QRCode(box,{text:payload,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});

        box.innerHTML='<p class="muted">QR library failed to load. Refresh.</p>';

      $('dlq').onclick=openDl;$('dlq2').onclick=openDl;
      $('shareQr').onclick=async()=>{
        try{ await navigator.clipboard.writeText(payload); toast('Copied'); }
        catch{ toast(payload); }

      const rot=$('rotateQr');

        try{
          const {error}=await sb.rpc('rotate_qr_token');
          if(error) throw error;
          toast('QR rotated');
          show('qrCode');

          c.querySelector('#pcv').onclick=()=>show('biz',{id:b.id})})});
      msg.innerHTML=`<p class="muted sm" style="margin:0 0 4px 4px">📡 Your GPS accuracy: about ${Math.round(pos.acc||0)} m${(pos.acc||0)>100?' (weak — go outside and turn on High accuracy location)':''}</p><p class="muted sm" style="margin:0 0 8px 4px">${near.length?near.length+' business'+(near.length>1?'es':'')+' within 10 km of you':'No BT businesses near you yet. You are the first here.'}</p>`;

/* ================= ROUND 6: profiles, live search, follow, communities, chats, settings ================= */
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
let verifiedAt=0;
const timeAgo=d=>{const s=(Date.now()-new Date(d))/1000;if(s<60)return 'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
let _lastDay='';const dayLbl=d=>{const x=new Date(d),t=new Date(),y=new Date(Date.now()-864e5);const k=z=>z.toDateString();return k(x)===k(t)?'Today':k(x)===k(y)?'Yesterday':x.toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})};
const dayChip=(box,d)=>{const k=new Date(d).toDateString();if(box.dataset.day===k)return;box.dataset.day=k;const c=document.createElement('div');c.className='day';c.textContent=dayLbl(d);box.appendChild(c)};
const clock=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const picAva=(url,name,cls='')=>{const u=safeImg(url);return `<div class="ava round ${cls}">${u?`<img src="${esc(u)}" alt="">`:esc(initial(name))}</div>`};
const bizPic=(url,cls='')=>{const u=safeImg(url);return `<div class="ava ${cls}">${u?`<img src="${esc(u)}" alt="">`:'🏪'}</div>`};
const fe=e=>{const m=(e&&e.message)||'';if(/Device not approved/.test(m))return 'This device is not approved yet.';if(/row-level security|policy/.test(m))return 'That is not allowed.';return m||'Something went wrong.'};
const nfol=n=>`${n} follower${n===1?'':'s'}`;
function stopPoll(){if(window.__poll){clearInterval(window.__poll);window.__poll=null}}
function sheet(items){
  const o=document.createElement('div');o.className='sheetbg';
  o.innerHTML=`<div class="sheet">${items.map((x,i)=>`<button data-i="${i}" class="${x.danger?'danger':''}">${esc(x.t)}</button>`).join('')}<button data-i="-1" class="cancel">Cancel</button></div>`;
  o.onclick=e=>{const b=e.target.closest('button');if(e.target===o||(b&&b.dataset.i==='-1')){o.remove();return}if(b){const it=items[+b.dataset.i];o.remove();it.fn()}};
  document.body.appendChild(o);
}
async function setFollow(uid,on){
  const q=on?sb.from('follows').insert({follower_id:me.id,followee_id:uid}):sb.from('follows').delete().eq('follower_id',me.id).eq('followee_id',uid);
  const {error}=await q;
  if(error&&!/duplicate/.test(error.message)){toast(/row-level|policy/.test(error.message)?(profile&&profile.role==='business'?'Businesses can only follow their own Top Dog or Don.':'You cannot follow this account.'):'Could not update follow');return false}
  return true;
}
function needVerify(next){ if(Date.now()-verifiedAt<9*60000)show(next); else show('verify',{next}); }

/* ---------- live search (Facebook style) ---------- */
function resultRow(r){
  const biz=r.kind==='business';
  const pic=biz?bizPic(r.avatar_url):picAva(r.avatar_url,r.name);
  const sub=biz?`${esc(r.subtitle)} · ${nfol(r.followers)}`:`@${esc(r.username)} · ${nfol(r.followers)}`;

function openResult(k,id){ if(k==='business')show('biz',{id}); else show('profile',{id}); }
function liveSearch(inp,box,o={}){
  const full=!!o.full,limit=o.limit||10;let seq=0,t=null,last=[];
  const paint=()=>{
    const q=inp.value.trim();
    const rows=last.filter(r=>!o.filter||o.filter()==='all'||r.kind===o.filter());
    box.innerHTML=(rows.length?rows.map(resultRow).join(''):`<div class="muted sm" style="padding:14px">No results for “${esc(q)}”.</div>`)
      +(!full&&rows.length?`<button class="sr" data-all="1"><div class="ava round" style="background:var(--s2)">🔍</div><div class="grow nm">See all results for “${esc(q)}”</div></button>`:'');
    box.querySelectorAll('.sr[data-id]').forEach(b=>b.onclick=()=>{ if(o.pick)o.pick(b.dataset.k,b.dataset.id); else openResult(b.dataset.k,b.dataset.id) });
    const all=box.querySelector('[data-all]');if(all)all.onclick=()=>{query=inp.value;show('search')};
  };
  const run=async()=>{
    const q=inp.value.trim(),my=++seq;
    if(!q){last=[];box.innerHTML=full?'<p class="muted sm" style="padding:6px 4px">Type a name or @username…</p>':'';box.style.display=full?'block':'none';return}
    box.style.display='block';
    if(!last.length)box.innerHTML='<div class="muted sm" style="padding:14px">Searching…</div>';
    const {data,error}=await sb.rpc('search_all',{p_q:q.replace(/^@/,''),p_limit:limit});
    if(my!==seq)return;
    if(error){box.innerHTML='<div class="muted sm" style="padding:14px">Search is not ready yet. Run bt_step6.sql in Supabase.</div>';return}
    last=data||[];paint();
  };
  inp.oninput=()=>{clearTimeout(t);t=setTimeout(run,180)};
  if(!full){inp.onblur=()=>setTimeout(()=>{box.style.display='none'},220);inp.onfocus=()=>{if(inp.value.trim())run()}}
  return {run,repaint:paint};
}

/* ---------- community (group chat) ---------- */
community(p){
  const bid=p.id;let lastId=0,info=null,replyTo=null;const seen=new Map();
  return {html:`<div class="chead"><button class="ib" data-back>‹</button><button class="row grow" id="ch" style="text-align:left"><div id="chav"></div><div class="grow"><div class="nm" id="chn">Community</div><div class="muted sm" id="chs">&nbsp;</div></div></button><button class="ib" id="chm" aria-label="Menu">⋮</button></div>

    if(cur.name!=='community')return;
    if(!info){$('msgs').innerHTML='<div class="empty"><i>🔒</i>This community is not available.</div>';$('comp').remove();return}
    if(!info.is_owner&&!info.i_follow){$('msgs').innerHTML='<div class="empty"><i>👥</i>Follow this business to join its community.</div>';$('comp').remove();return}
    $('chav').innerHTML=bizPic(info.logo_url,'sm');$('chn').textContent=info.name;$('chs').textContent=nfol(info.followers).replace('follower','member')+' · tap for business info';
    $('ch').onclick=()=>show('biz',{id:bid});
    const items=[{t:'Business profile',fn:()=>show('biz',{id:bid})},{t:'Members',fn:()=>show('members',{id:bid})}];
    if(info.is_owner)items.push({t:info.locked?'Allow members to reply':'Pause member replies',fn:async()=>{
      const {error}=await sb.rpc('set_community_locked',{p_business:bid,p_locked:!info.locked});if(error){toast(fe(error));return}
      info.locked=!info.locked;toast(info.locked?'Members can read only':'Members can reply');drawComp()}});
    else items.push({t:'Leave community',danger:true,fn:async()=>{if(!confirm('Leave this community?'))return;if(await setFollow(info.owner_id,false)){toast('You left');back()}}});
    $('chm').onclick=()=>sheet(items);
    const drawComp=()=>{
      const c=$('comp');if(!c)return;
      if(info.locked&&!info.is_owner){c.innerHTML='<div class="in muted sm" style="justify-content:center;padding:10px">The business has paused replies. You can still read messages.</div>';return}
      c.innerHTML=`<div class="in" style="flex-direction:column;align-items:stretch;gap:6px"><div id="rb" class="rbar" style="display:${replyTo?'flex':'none'}"><span id="rt"></span><button id="rx">✕</button></div>
      <div style="display:flex;gap:8px;align-items:flex-end"><input id="mi" maxlength="1000" placeholder="${info.is_owner?'Post to your community':'Reply or share a suggestion'}" autocomplete="off"><button class="sendb" id="sd" aria-label="Send">➤</button></div></div>`;
      const send=async()=>{const body=$('mi').value.trim();if(!body)return;$('sd').disabled=true;
        const {error}=await sb.rpc('post_community',{p_business:bid,p_body:body,p_reply_to:replyTo});$('sd').disabled=false;
        if(error){toast(fe(error));return}
        $('mi').value='';replyTo=null;$('rb').style.display='none';pull(false,true)};
      $('sd').onclick=send;$('mi').onkeydown=e=>{if(e.key==='Enter')send()};
      $('rx').onclick=()=>{replyTo=null;$('rb').style.display='none'};
    };
    drawComp();
    const paint=(rows,replace)=>{
      const box=$('msgs');if(!box)return;
      const near=(window.innerHeight+window.scrollY)>=document.body.scrollHeight-160;
      if(replace){seen.clear();box.innerHTML='';delete box.dataset.day}
      if(replace&&!rows.length)box.innerHTML='<div class="empty" id="e0"><i>💬</i>No messages yet. '+(info.is_owner?'Post your first update.':'Say hello or share a suggestion.')+'</div>';
      if(rows.length&&$('e0'))$('e0').remove();
      rows.forEach(m=>{
        if(seen.has(m.id))return;seen.set(m.id,m);lastId=Math.max(lastId,m.id);
        const mine=m.sender_id===me.id,isOwner=m.sender&&m.sender.role==='business';
        const q=m.reply_to?seen.get(m.reply_to):null;
        const can=mine||info.is_owner;
        const d=document.createElement('div');d.className='mrow'+(mine?' me':'');
        const who=isOwner?info.name:((m.sender&&m.sender.display_name)||'Member');const pic=isOwner?(info.logo_url||(m.sender&&m.sender.avatar_url)):(m.sender&&m.sender.avatar_url);
        d.innerHTML=`<div class="mline">${picAva(pic,who,'sm')}<div class="mcol"><div class="msg ${mine?'me':''}">${!mine?`<small>${esc(who)}${isOwner?' <span class="tg">Business</span>':''}</small>`:''}${m.reply_to?`<div class="q">${q?esc(q.body.slice(0,80)):'Original message'}</div>`:''}${esc(m.body)}<div class="mt">${clock(m.created_at)}</div></div>
        <div class="mact"><button data-r="${m.id}">Reply</button>${can?`<button data-x="${m.id}">Delete</button>`:''}</div></div></div>`;
        dayChip(box,m.created_at);
        d.querySelector('[data-r]').onclick=()=>{replyTo=m.id;if($('rb')){$('rb').style.display='flex';$('rt').textContent='Replying to: '+m.body.slice(0,50);$('mi').focus()}};
        const x=d.querySelector('[data-x]');if(x)x.onclick=async()=>{if(!confirm('Delete this message?'))return;
          const {error}=await sb.rpc('delete_community_message',{p_id:m.id});if(error){toast(fe(error));return}d.remove();seen.delete(m.id)};
        box.appendChild(d);
      });
      if(replace||near)window.scrollTo(0,document.body.scrollHeight);
    };
    const pull=async(first,force)=>{
      let q=sb.from('community_messages').select('id,sender_id,body,reply_to,created_at,sender:profiles(display_name,username,avatar_url,role)').eq('business_id',bid);
      q=first?q.order('id',{ascending:false}).limit(60):q.gt('id',lastId).order('id',{ascending:true}).limit(100);
      const {data,error}=await q;
      if(cur.name!=='community'||error)return;
      let rows=data||[];if(first)rows=rows.reverse();
      if(first||rows.length||force)paint(rows,first);
    };
    await pull(true);
    stopPoll();window.__poll=setInterval(()=>{if(document.visibilityState==='visible'&&cur.name==='community')pull(false)},6000);
  }};

/* ---------- identity check: password, then emailed code ---------- */
verify(p){
  let step=1,fails=0,lock=0;
  const draw1=()=>{
    $('vb').innerHTML=`<p class="muted">To protect your account, confirm it is you. Step 1 of 2: enter your password.</p>
    <input id="vp" type="password" placeholder="Current password" autocomplete="current-password"><div class="err" id="er"></div><button class="btn" id="vn">Continue</button>`;
    $('vn').onclick=async()=>{
      if(Date.now()<lock){$('er').textContent='Too many attempts. Wait a minute.';return}
      const pw=$('vp').value;if(!pw){$('er').textContent='Enter your password';return}
      $('vn').disabled=true;
      const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
      const r=await tmp.auth.signInWithPassword({email:me.email,password:pw});
      if(r.error){$('vn').disabled=false;if(++fails>=5){lock=Date.now()+60000;fails=0}$('er').textContent='Wrong password';return}
      try{await tmp.auth.signOut()}catch{}
      const o=await sb.auth.signInWithOtp({email:me.email,options:{shouldCreateUser:false}});
      if(o.error){$('vn').disabled=false;$('er').textContent='Could not send the code. Wait a minute and try again.';return}
      step=2;draw2();
    };
  };
  const draw2=()=>{
    $('vb').innerHTML=`<p class="muted">Step 2 of 2: we sent a code to <b style="color:var(--text)">${esc(me.email)}</b>. Enter it below.</p>
    <input id="vc" inputmode="numeric" maxlength="8" placeholder="Code" style="text-align:center;font-size:24px;letter-spacing:8px"><div class="err" id="er"></div><div class="ok" id="ok"></div>
    <button class="btn" id="vg">Confirm</button><div style="text-align:center"><button class="link" id="vr">Send a new code</button></div>`;
    $('vg').onclick=async()=>{
      const token=$('vc').value.trim();if(token.length<6){$('er').textContent='Enter the code from your email';return}
      $('vg').disabled=true;
      const {error}=await sb.auth.verifyOtp({email:me.email,token,type:'email'});
      if(error){$('vg').disabled=false;$('er').textContent='Wrong or expired code';return}
      const {data:{user}}=await sb.auth.getUser();if(user)me=user;
      const g=await gateCheck();
      if(g==='pending'){pendingView();return}
      if(g==='denied'){await sb.auth.signOut();loginView('This device was not approved.');return}
      verifiedAt=Date.now();stack.pop();show(p.next);
    };
    $('vr').onclick=async()=>{const {error}=await sb.auth.signInWithOtp({email:me.email,options:{shouldCreateUser:false}});
      $('er').textContent=error?'Please wait a minute before asking again.':'';$('ok').textContent=error?'':'New code sent.'};
  };
  return {html:`${topbar('Confirm it is you')}<div id="vb"></div>`,bind(){draw1()}};
},
changeName(){
  let next=null;if(profile.name_changed_at){const d=new Date(profile.name_changed_at);d.setDate(d.getDate()+90);if(d>new Date())next=d}
  return {html:`${topbar('Name')}<label class="f">Name</label><input id="nm" maxlength="60" value="${esc(profile.display_name)}" ${next?'disabled':''}>

/* ---------- status (stories) viewer ---------- */
function openStories(groups,gi,onClose){
  let g=gi,i=0,timer=null;
  const o=document.createElement('div');o.className='sview';document.body.appendChild(o);document.body.style.overflow='hidden';
  const close=()=>{clearTimeout(timer);o.remove();document.body.style.overflow='';if(onClose)onClose()};
  const next=()=>{const grp=groups[g];if(i<grp.items.length-1){i++;render()}else if(g<groups.length-1){g++;i=0;render()}else close()};
  const prev=()=>{if(i>0){i--;render()}else if(g>0){g--;i=Math.max(0,groups[g].items.length-1);render()}else render()};
  function render(){
    clearTimeout(timer);const grp=groups[g],s=grp.items[i];if(!s){close();return}
    const vid=s.media_type==='video';
    o.innerHTML=`<div class="sbars">${grp.items.map((_,k)=>`<i class="${k<i?'done':''}"><b id="${k===i?'sbar':''}"></b></i>`).join('')}</div>
    <div class="shead">${picAva(grp.avatar_url,grp.name,'sm')}<div class="grow"><b>${esc(grp.mine?'Your status':grp.name)}</b><div class="sm" style="opacity:.8">${timeAgo(s.created_at)}</div></div>${grp.mine?'<button id="sdel" aria-label="Delete">🗑</button>':''}<button id="sx" aria-label="Close">✕</button></div>
    <div class="smedia">${vid?`<video id="svid" src="${esc(s.media_url)}" playsinline autoplay></video>`:`<img src="${esc(s.media_url)}" alt="">`}</div>
    ${s.caption?`<div class="scap">${esc(s.caption)}</div>`:''}
    ${grp.mine?`<button class="sviews" id="svw">👁 ${s.views||0} view${s.views===1?'':'s'}</button>`:''}
    <button class="szl" id="sprev" aria-label="Previous"></button><button class="szr" id="snext" aria-label="Next"></button>`;
    const bar=$('sbar'),run=sec=>{if(!bar)return;bar.style.animationDuration=sec+'s';bar.classList.add('run')};
    if(vid){const v=$('svid');v.onloadedmetadata=()=>run(Math.min(v.duration||15,60));v.onended=next;v.onerror=()=>{timer=setTimeout(next,2500)}}
    else{run(5);timer=setTimeout(next,5000)}
    $('sx').onclick=close;$('sprev').onclick=prev;$('snext').onclick=next;
    if(!grp.mine&&!s.seen){s.seen=true;sb.rpc('mark_story_seen',{p_id:s.id})}
    if(grp.mine){
      $('sdel').onclick=async()=>{if(!confirm('Delete this status?'))return;
        const {error}=await sb.from('stories').delete().eq('id',s.id);if(error){toast('Could not delete');return}
        grp.items.splice(i,1);if(!grp.items.length){groups.splice(g,1);if(!groups.length){close();return}if(g>=groups.length)g=groups.length-1;i=0}else if(i>=grp.items.length)i=grp.items.length-1;render()};
      $('svw').onclick=async()=>{clearTimeout(timer);const v=$('svid');if(v)v.pause();
        const r=await sb.rpc('story_viewers',{p_id:s.id});const rows=r.data||[];
        const sh=document.createElement('div');sh.className='sheetbg';sh.style.zIndex=300;
        sh.innerHTML=`<div class="sheet" style="max-height:60vh;overflow:auto"><div style="padding:12px;font-weight:700">Seen by ${rows.length}</div>${rows.length?rows.map(u=>`<div class="sr">${picAva(u.avatar_url,u.display_name,'sm')}<div class="grow"><div class="nm">${esc(u.display_name||u.username)}</div><div class="muted sm">@${esc(u.username)} · ${timeAgo(u.seen_at)}</div></div></div>`).join(''):'<p class="muted" style="padding:0 12px 12px">No views yet.</p>'}<button class="cancel" id="vx">Close</button></div>`;
        document.body.appendChild(sh);sh.onclick=e=>{if(e.target===sh||e.target.id==='vx'){sh.remove();render()}}};
    }
  }
  render();
}

Object.assign(VIEWS,{
/* ---------- Chat tab: statuses bar + chats + communities ---------- */
chat(){
  let filter='all',convs=[],coms=[],groups=[];
  const isBiz=profile.role==='business';
  return {html:`<div class="top"><b style="font-size:22px">Chat</b></div>
  <div class="mh" style="margin-top:0">Statuses</div><div class="hs" id="sbar2" style="margin-bottom:10px"><div class="muted sm" style="padding:10px">Loading…</div></div>
  <div class="srchwrap"><div class="srch"><input id="cq" placeholder="Search people or businesses" autocomplete="off"></div><div id="cdrop" class="sdrop" style="display:none"></div></div>
  <div class="chips" id="cf"><button class="on" data-f="all">All</button><button data-f="dm">Chats</button><button data-f="com">Communities</button></div>
  <div id="clist">${skel(5)}</div>`,
  async bind(){
    liveSearch($('cq'),$('cdrop'),{limit:8});
    const paintBar=()=>{
      const mine=groups.find(x=>x.mine);
      const tiles=[];
      if(!isBiz)tiles.push(`<button class="stt" data-i="me"><div class="ring ${mine?(mine.items.every(s=>true)?'seen0':''):'none'}">${picAva(profile.avatar_url,profile.display_name,'md')}</div><span class="plusb2" data-add="1">＋</span><div class="sm">Your status</div></button>`);
      groups.filter(x=>!x.mine).forEach((x,k)=>tiles.push(`<button class="stt" data-i="${groups.indexOf(x)}"><div class="ring ${x.items.every(s=>s.seen)?'seen':''}">${picAva(x.avatar_url,x.name,'md')}</div><div class="sm">${esc(x.name.split(' ')[0])}</div></button>`));
      $('sbar2').innerHTML=tiles.length?tiles.join(''):'<div class="muted sm" style="padding:10px">No statuses yet. Statuses from people you follow show here for 24 hours.</div>';
      document.querySelectorAll('#sbar2 .stt').forEach(b=>b.onclick=e=>{
        if(b.dataset.i==='me'){ if(e.target.closest('[data-add]')||!mine){show('addStatus');return} openStories(groups,groups.indexOf(mine),loadBar);return }
        openStories(groups,+b.dataset.i,loadBar)});
    };
    async function loadBar(){
      const {data,error}=await sb.rpc('story_feed');
      if(cur.name!=='chat')return;
      if(error){$('sbar2').innerHTML='<div class="muted sm" style="padding:10px">Statuses are not ready yet. Run bt_step7.sql in Supabase.</div>';return}
      const map=new Map();
      (data||[]).forEach(s=>{if(!map.has(s.user_id))map.set(s.user_id,{uid:s.user_id,name:s.display_name||s.username,avatar_url:s.avatar_url,mine:s.user_id===me.id,items:[]});map.get(s.user_id).items.push(s)});
      groups=[...map.values()].sort((a,b)=>(b.mine-a.mine)||((a.items.every(s=>s.seen)?1:0)-(b.items.every(s=>s.seen)?1:0)));
      paintBar();
    }
    const paint=()=>{
      const rows=[...(filter!=='com'?convs.map(c=>({t:'dm',at:c.last_at,c})):[]),...(filter!=='dm'?coms.map(c=>({t:'com',at:c.last_at,c})):[])].sort((a,b)=>new Date(b.at)-new Date(a.at));
      $('clist').innerHTML=rows.length?rows.map((r,i)=>{const c=r.c;
        return r.t==='dm'
          ?`<button class="sr" data-i="${i}">${picAva(c.avatar_url,c.display_name)}<div class="grow"><div class="nm">${esc(c.display_name||c.username)}</div><div class="muted sm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.last_mine?'You: ':''}${esc(c.last_body)}</div></div><span class="muted sm">${timeAgo(c.last_at)}</span></button>`
          :`<button class="sr" data-i="${i}">${bizPic(c.logo_url)}<div class="grow"><div class="nm">${esc(c.name)} <span class="tg">Community</span></div><div class="muted sm" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.last_body?esc(c.last_body):nfol(c.members).replace('follower','member')}</div></div><span class="muted sm">${c.last_body?timeAgo(c.last_at):''}</span></button>`}).join('')
        :`<div class="empty"><i>💬</i><b style="color:var(--text)">${filter==='com'?'No communities yet':'No chats yet'}</b><p>${filter==='com'?'Follow a business to join its community.':'Search for someone above and follow them to start chatting.'}</p></div>`;
      document.querySelectorAll('#clist .sr').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.i],c=r.c;
        if(r.t==='dm')show('dm',{id:c.other_id,name:c.display_name||c.username,username:c.username,avatar:c.avatar_url});else show('community',{id:c.id})});
    };
    document.querySelectorAll('#cf button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('#cf button').forEach(x=>x.classList.toggle('on',x===b));paint()});
    loadBar();
    const [a,b]=await Promise.all([sb.rpc('my_conversations'),sb.rpc('my_communities')]);
    if(cur.name!=='chat')return;
    if(a.error&&b.error){$('clist').innerHTML='<div class="empty"><i>⚙️</i>Run bt_step6.sql in Supabase to switch on chats.</div>';return}
    convs=a.data||[];coms=b.data||[];paint();
  }};
},
communities(){return VIEWS.chat()},

/* ---------- Discover: real business videos ---------- */
discover(){
  let tab='all',q='',before=null,busy=false,end=false,obs=null;
  return {html:`<div class="top" style="margin-bottom:4px"><b style="font-size:22px">Discover</b>${profile.role==='business'?`<button class="ib" id="goPost" style="margin-left:auto" aria-label="Post">＋</button>`:''}</div>
  <div class="srch" style="margin-bottom:8px"><input id="dq" placeholder="Search videos, #hashtags, businesses" autocomplete="off"></div>
  <div class="chips" id="dchips"><button class="on" data-q="">All</button><button data-q="#food">#Food</button><button data-q="#fashion">#Fashion</button><button data-q="#beauty">#Beauty</button><button data-q="#tech">#Tech</button><button data-q="#deals">#Deals</button></div>
  <div class="seg" id="dseg"><button class="on" data-tab="all">For Me</button><button data-tab="following">Following</button></div>
  <div class="dfeed" id="dfeed"><div class="dcard"><div class="sk full"></div></div></div>`,
  bind(){
    const feed=$('dfeed');
    if($('goPost'))$('goPost').onclick=()=>show('addDiscover');
    const card=v=>`<div class="dcard" data-id="${esc(v.id)}"><video src="${esc(v.video_url)}" poster="${esc(posterOf(v.video_url))}" loop muted playsinline preload="metadata"></video>
      <div class="dshade"></div>
      <div class="dside"><button data-lk="${esc(v.id)}" class="${v.i_liked?'on':''}" data-n="${v.like_count||0}" aria-label="Like"><b class="ic">${v.i_liked?'❤️':'🤍'}</b><span>${v.like_count||0}</span></button><button data-cm="${esc(v.id)}" data-n="${v.comment_count||0}" aria-label="Comments"><b class="ic">💬</b><span>${v.comment_count||0}</span></button><button data-bm="${esc(v.id)}" class="${v.bookmarked?'on':''}" aria-label="Bookmark">${v.bookmarked?'🔖':'🏷️'}<span>Save</span></button><button data-rp="${esc(v.id)}" aria-label="Report"><b class="ic">🚩</b><span>Report</span></button><button data-mu aria-label="Sound">🔇<span>Sound</span></button></div>
      <div class="dinfo"><button class="row" data-b="${esc(v.business_id)}" style="text-align:left">${bizPic(v.logo_url,'sm')}<b>${esc(v.business_name)}</b></button>
        ${v.caption?`<p>${esc(v.caption)}</p>`:''}${v.i_follow||profile.role==='business'?'':`<button class="btn sm2" data-f="${esc(v.business_id)}" style="width:auto;padding:8px 16px">Follow</button>`}</div></div>`;
    const wire=root=>{
      root.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>show('biz',{id:b.dataset.b}));
      root.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{
        const bz=await sb.rpc('business_summary',{p_business:b.dataset.f});const x=bz.data&&bz.data[0];if(!x)return;
        if(await setFollow(x.owner_id,true)){toast('Following');document.querySelectorAll(`[data-f="${b.dataset.f}"]`).forEach(e=>e.remove())}});
      root.querySelectorAll('[data-lk]').forEach(b=>b.onclick=async()=>{
        if(profile.role!=='customer'){toast('Only customers can like videos');return}
        const on=!b.classList.contains('on');
        b.classList.toggle('on',on);b.querySelector('.ic').textContent=on?'❤️':'🤍';b.classList.remove('pop');void b.offsetWidth;if(on)b.classList.add('pop');
        const {data,error}=await sb.rpc('set_video_like',{p_video:b.dataset.lk,p_on:on});
        if(error){b.classList.toggle('on',!on);b.querySelector('.ic').textContent=on?'🤍':'❤️';toast(/does not exist|schema cache/i.test(error.message)?'Run bt_step9.sql in Supabase to switch on likes':error.message);return}
        b.querySelector('span').textContent=data});
      root.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>reportSheet('video',b.dataset.rp));
      root.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>openComments(b.dataset.cm,n=>{b.querySelector('span').textContent=n}));
      root.querySelectorAll('[data-bm]').forEach(b=>b.onclick=async()=>{
        const on=b.classList.contains('on');
        const {error}=on?await sb.from('bookmarks').delete().eq('user_id',me.id).eq('video_id',b.dataset.bm):await sb.from('bookmarks').insert({user_id:me.id,video_id:b.dataset.bm});
        if(error){toast('Could not save');return}b.classList.toggle('on',!on);b.firstChild.textContent=on?'🏷️':'🔖'});
      root.querySelectorAll('.dcard').forEach(c=>{
        const v=c.querySelector('video');
        c.querySelector('[data-mu]').onclick=e=>{e.stopPropagation();v.muted=!v.muted;e.currentTarget.firstChild.textContent=v.muted?'🔇':'🔊'};
        v.onclick=()=>{if(v.paused)v.play().catch(()=>{});else v.pause()};
        obs.observe(c)});
    };
    obs=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');
      if(e.isIntersecting&&e.intersectionRatio>.6){v.play().catch(()=>{});
        if(e.target===feed.lastElementChild)load()}else v.pause()}),{root:feed,threshold:[0,.6,1]});
    async function load(reset){
      if(busy||(end&&!reset))return;busy=true;
      if(reset){before=null;end=false;feed.innerHTML='<div class="dcard"><div class="sk full"></div></div>'}
      const {data,error}=await sb.rpc('discover_feed',{p_tab:tab,p_q:q||null,p_limit:8,p_before:before});
      busy=false;if(cur.name!=='discover')return;
      if(error){feed.innerHTML='<div class="empty"><i>⚙️</i>Run bt_step7.sql in Supabase to switch on the video feed.</div>';return}
      const rows=data||[];
      if(reset)feed.innerHTML='';
      if(!rows.length){end=true;if(!feed.children.length)feed.innerHTML=`<div class="empty"><i>🎬</i><b style="color:var(--text)">${tab==='following'?'Nothing from businesses you follow':'No videos yet'}</b><p>${tab==='following'?'Follow businesses to see their videos here.':'Videos from verified businesses will appear here.'}</p></div>`;return}
      before=rows[rows.length-1].created_at;
      const tmp=document.createElement('div');tmp.innerHTML=rows.map(card).join('');
      [...tmp.children].forEach(c=>{feed.appendChild(c);wire(c.parentNode===feed?c.parentNode:feed)});
    }
    document.querySelectorAll('#dseg button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('#dseg button').forEach(x=>x.classList.toggle('on',x===b));load(true)});
    document.querySelectorAll('#dchips button').forEach(c=>c.onclick=()=>{q=c.dataset.q;$('dq').value=q;document.querySelectorAll('#dchips button').forEach(x=>x.classList.toggle('on',x===c));load(true)});
    $('dq').onkeydown=e=>{if(e.key==='Enter'){q=$('dq').value.trim();load(true)}};
    load(true);
  }};
},

/* ---------- my business page: status, type, edit ---------- */
myBiz(){

    :st==='suspended'?`<div class="card"><b style="color:var(--red)">Suspended by BT</b><p class="muted sm" style="margin:6px 0 0">${esc(myBiz.rejection_reason||'Contact BT support for details.')}</p></div>`
    :`<div class="card sm muted" style="text-align:center">⏳ Under review. The BT team may call ${esc(myBiz.phone||'your phone number')}. You will get a notification when approved.</div>`;

  <label class="f">About</label><textarea id="bab" maxlength="500">${esc(myBiz.about||'')}</textarea>
  <label class="f">Address</label><input id="bad" value="${esc(myBiz.address||'')}">
  <div class="err" id="er"></div><button class="btn" id="bsv">Save</button>`,
  bind(){
    $('bph').onclick=()=>$('bfile').click();

      const bad=await validateMediaFile(file,{allowVideo:false,allowImage:true});if(bad){toast(bad);return}
      toast('Uploading…');
      try{const url=await uploadToCloudinary(file,'image');
        if(url){const {error}=await sb.from('businesses').update({logo_url:url}).eq('id',myBiz.id);
          if(!error){myBiz.logo_url=url;$('blg').innerHTML=bizPic(url,'xl sq');toast('Logo updated')}else toast('Could not save the logo')}
      }catch(err){toast((err&&err.message)||'Upload failed')}};
    $('bsv').onclick=async()=>{const name=$('bnm').value.trim();if(name.length<2){$('er').textContent='Enter your business name';return}
      $('bsv').disabled=true;const patch={name,about:$('bab').value.trim()||null,address:$('bad').value.trim()||null};
      const {error}=await sb.from('businesses').update(patch).eq('id',myBiz.id);$('bsv').disabled=false;
      if(error){$('er').textContent='Could not save';return}Object.assign(myBiz,patch);toast('Saved');back()};
    const rs=$('rs');if(rs)rs.onclick=async()=>{rs.disabled=true;const {error}=await sb.rpc('resubmit_business');
      if(error){rs.disabled=false;toast(error.message);return}toast('Sent for review again');startApp()};
  }};
}
});

/* ---------- boot ---------- */
(async()=>{
  splash();await wait(1200);
  if(recovering)return;
  // purge old long-lived sessions that were never opted in via "Remember me"
  if(!remember){try{Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k))}catch{}}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginView();return}
  if(remember){const at=Number(lsGet('bt_login_at')||0);
    if(!at||Date.now()-at>SESSION_DAYS*86400000){await sb.auth.signOut();loginView('Please log in again.');return}}
  startApp();
})();
</script>
